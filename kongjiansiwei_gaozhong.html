<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中生空间思维测评分析系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --p: #ffffff;
            --s: #f6f8ff;
            --a: #eef1ff;
            --h: #667eea;
            --h2: #764ba2;
            --t: #1e293b;
            --tm: #64748b;
            --ok: #10b981;
            --w: #f59e0b;
            --r: #ef4444;
            --gl: #a8c0ff;
            --gp: #c4b5fd;
            --grad: linear-gradient(135deg, #667eea 0%, #764ba2 55%, #f093fb 100%);
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--grad);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--t);
            overflow-x: hidden;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn .5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glowPulse {
            0%, 100% { opacity: .35; transform: scale(1); }
            50% { opacity: .6; transform: scale(1.15); }
        }

        @keyframes dimFlash {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(102,126,234,.6); }
            50% { transform: scale(1.06); box-shadow: 0 0 0 12px rgba(102,126,234,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(102,126,234,0); }
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            box-shadow: 0 18px 40px -14px rgba(0, 0, 0, 0.22);
            padding: 34px;
            margin-bottom: 18px;
            backdrop-filter: blur(8px);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 30px;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .3s ease;
            color: #fff;
            background: linear-gradient(135deg, var(--h), var(--h2));
            box-shadow: 0 10px 22px rgba(102, 126, 234, 0.35);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(102, 126, 234, 0.45);
        }

        .btn-secondary {
            background: rgba(100, 116, 139, 0.12);
            color: var(--tm);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(100, 116, 139, 0.2);
            color: var(--t);
        }

        .footer-sign {
            text-align: center;
            margin-top: 22px;
            color: rgba(255, 255, 255, 0.85);
            font-size: .88rem;
            letter-spacing: 1px;
        }

        /* ===== 登录页 ===== */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--grad);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity .4s;
        }

        .login-box {
            background: #fff;
            border-radius: 20px;
            padding: 40px 34px 30px;
            width: 320px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn .6s ease;
        }

        .login-logo svg {
            width: 86px;
            height: 86px;
            margin-bottom: 6px;
            animation: float 3s ease-in-out infinite;
        }

        .login-box h2 {
            margin: 0 0 6px;
            font-size: 22px;
            color: var(--t);
            font-weight: 800;
        }

        .login-sub {
            font-size: 12px;
            color: var(--tm);
            margin-bottom: 20px;
        }

        .login-input {
            width: 100%;
            padding: 13px 16px;
            margin: 8px 0;
            border: 1.8px solid #e5e7f0;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color .3s, box-shadow .3s;
        }

        .login-input:focus {
            border-color: var(--h);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            margin: 14px 0 8px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--h), var(--h2));
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity .3s, transform .2s;
        }

        .login-btn:hover {
            opacity: .9;
            transform: translateY(-1px);
        }

        .login-error {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            min-height: 18px;
        }

        .login-credits {
            text-align: center;
            margin-top: 14px;
            font-size: 12px;
            color: #aaa;
        }

        /* ===== 欢迎页 ===== */
        .welcome-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .welcome-icon {
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
            animation: float 3s ease-in-out infinite;
        }

        .welcome-title {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--h), var(--h2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .welcome-subtitle {
            font-size: 1.02rem;
            color: var(--tm);
            line-height: 2;
            text-align: center;
        }

        .dimension-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 26px 0;
        }

        .dimension-item {
            background: linear-gradient(135deg, #f5f7fa, #eef1ff);
            border: 1px solid rgba(102, 126, 234, 0.12);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            transition: all .3s ease;
        }

        .dimension-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.16);
        }

        .dimension-icon {
            font-size: 2rem;
            margin-bottom: 6px;
        }

        .dimension-name {
            font-weight: 700;
            color: var(--t);
            font-size: .92rem;
        }

        .dimension-desc {
            font-size: .74rem;
            color: var(--tm);
            margin-top: 4px;
            line-height: 1.6;
        }

        .welcome-footer {
            text-align: center;
            margin-top: 18px;
            color: var(--tm);
            font-size: .85rem;
        }

        /* ===== 信息页 ===== */
        .main-title {
            text-align: center;
            font-size: 1.7em;
            color: var(--t);
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--tm);
            font-size: 1em;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--tm);
            font-weight: 600;
            font-size: .92em;
        }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            background: #fafbff;
            border: 2px solid #e5e7f0;
            border-radius: 12px;
            color: var(--t);
            font-size: 1em;
            outline: none;
            transition: border-color .3s, box-shadow .3s;
        }

        .form-input:focus {
            border-color: var(--h);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-select {
            width: 100%;
            padding: 13px 16px;
            background: #fafbff;
            border: 2px solid #e5e7f0;
            border-radius: 12px;
            color: var(--t);
            font-size: 1em;
            cursor: pointer;
            outline: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 10px;
        }

        /* ===== 答题页 ===== */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .quiz-progress {
            flex: 1;
            min-width: 180px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: .88em;
            color: var(--tm);
        }

        .progress-text b {
            color: var(--h);
        }

        .progress-bar {
            height: 10px;
            background: #eef0f8;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--h), var(--h2));
            border-radius: 6px;
            transition: width .7s cubic-bezier(.4, 0, .2, 1);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 22px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 6px;
        }

        .quiz-timer {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            color: #92400e;
            font-size: .95em;
            white-space: nowrap;
        }

        .dimension-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--h), var(--h2));
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: .9rem;
            font-weight: 700;
            margin-bottom: 16px;
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.3);
        }

        .dimension-badge.flash {
            animation: dimFlash .7s ease;
        }

        .question-card {
            background: #f8fafc;
            border: 1px solid #eef0f8;
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 18px;
        }

        .question-number {
            display: inline-block;
            background: linear-gradient(135deg, var(--h), var(--h2));
            color: #fff;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: .85rem;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .question-text {
            font-size: 1.12rem;
            color: var(--t);
            line-height: 1.75;
            margin-bottom: 18px;
        }

        .question-svg {
            display: flex;
            justify-content: center;
            margin: 14px 0;
        }

        .question-svg svg {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.08));
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: #fff;
            border: 2px solid #e5e7f0;
            border-radius: 14px;
            cursor: pointer;
            transition: all .3s ease;
            text-align: left;
        }

        .option-btn:hover {
            border-color: var(--h);
            background: #f0f4ff;
        }

        .option-btn.selected {
            border-color: var(--h);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.12), rgba(118, 75, 162, 0.12));
        }

        .option-btn.correct {
            border-color: var(--ok);
            background: rgba(16, 185, 129, 0.1);
        }

        .option-btn.wrong {
            border-color: var(--r);
            background: rgba(239, 68, 68, 0.08);
        }

        .option-btn.locked {
            cursor: default;
        }

        .option-btn.locked:hover {
            border-color: #e5e7f0;
            background: #fff;
        }

        .option-btn.locked.correct:hover {
            border-color: var(--ok);
            background: rgba(16, 185, 129, 0.1);
        }

        .option-btn.locked.wrong:hover {
            border-color: var(--r);
            background: rgba(239, 68, 68, 0.08);
        }

        .option-letter {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef0f8;
            border-radius: 50%;
            font-weight: 800;
            color: var(--tm);
            flex-shrink: 0;
            transition: all .28s;
        }

        .option-btn.selected .option-letter {
            background: linear-gradient(135deg, var(--h), var(--h2));
            color: #fff;
        }

        .option-btn.correct .option-letter {
            background: var(--ok);
            color: #fff;
        }

        .option-btn.wrong .option-letter {
            background: var(--r);
            color: #fff;
        }

        .option-text {
            flex: 1;
            font-size: .98rem;
            color: #334155;
        }

        .feedback-box {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: .95em;
            line-height: 1.75;
            animation: fadeIn .4s ease;
        }

        .feedback-correct {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #065f46;
        }

        .feedback-wrong {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.28);
            color: #991b1b;
        }

        .feedback-box .fb-title {
            font-weight: 800;
            margin-bottom: 4px;
        }

        .feedback-box .fb-exp {
            margin-top: 6px;
            padding-top: 8px;
            border-top: 1px dashed rgba(100, 116, 139, 0.25);
            color: var(--tm);
        }

        .quiz-navigation {
            display: flex;
            justify-content: space-between;
            gap: 14px;
        }

        .btn-nav {
            flex: 1;
        }

        /* ===== 报告页通用 ===== */
        .section-title {
            font-size: 1.22em;
            color: var(--h);
            margin: 4px 0 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.18);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .student-name {
            font-size: 1.85em;
            color: var(--h);
            font-weight: 800;
            margin-bottom: 6px;
        }

        .student-grade {
            color: var(--tm);
            font-size: 1em;
        }

        .score-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin: 26px 0;
        }

        .ring-wrap {
            position: relative;
            width: 190px;
            height: 190px;
        }

        .ring-wrap canvas {
            width: 190px;
            height: 190px;
        }

        .ring-center {
            position: absolute;
            top: 0;
            left: 0;
            width: 190px;
            height: 190px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .ring-score {
            font-size: 2.6em;
            font-weight: 900;
            background: linear-gradient(135deg, var(--h), var(--h2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .ring-label {
            font-size: .78em;
            color: var(--tm);
            margin-top: 6px;
        }

        .grade-badge {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--h), var(--h2));
            border-radius: 52px;
            font-size: 1.7em;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 10px 28px rgba(102, 126, 234, 0.4);
        }

        .grade-label {
            text-align: center;
            color: var(--tm);
            margin-top: 10px;
            font-size: .95em;
        }

        .meta-strip {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .meta-chip {
            background: #fafbff;
            border: 1px solid rgba(102, 126, 234, 0.14);
            padding: 9px 18px;
            border-radius: 22px;
            font-size: .85em;
            color: var(--tm);
        }

        .meta-chip b {
            color: var(--h);
        }

        .chart-container {
            display: flex;
            justify-content: center;
            margin: 16px 0;
            overflow-x: auto;
        }

        .chart-container canvas {
            max-width: 100%;
            height: auto;
        }

        .dimension-result {
            background: #fafbff;
            border: 1px solid rgba(102, 126, 234, 0.1);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 14px;
            animation: fadeIn .5s ease;
        }

        .dimension-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .dimension-name {
            font-weight: 700;
            font-size: 1em;
            color: var(--t);
        }

        .dimension-percent {
            font-size: 1.35em;
            font-weight: 900;
            color: var(--h);
        }

        .dimension-bar {
            height: 10px;
            background: #eef0f8;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .dimension-bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 1.1s cubic-bezier(.4, 0, .2, 1);
        }

        .dimension-stats {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            font-size: .86em;
            color: var(--tm);
            margin-bottom: 8px;
        }

        .dimension-stats span b {
            color: var(--t);
        }

        .ability-level {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 18px;
            font-size: .8em;
            font-weight: 700;
            margin-left: 6px;
        }

        .level-strong {
            background: rgba(16, 185, 129, 0.14);
            color: #065f46;
        }

        .level-medium {
            background: rgba(245, 158, 11, 0.15);
            color: #92400e;
        }

        .level-weak {
            background: rgba(239, 68, 68, 0.12);
            color: #991b1b;
        }

        .kp-list {
            display: grid;
            gap: 12px;
        }

        .kp-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            border: 1px solid #eef0f8;
            border-radius: 14px;
            padding: 12px 16px;
        }

        .kp-rank {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--r), #f97316);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: .85em;
            flex-shrink: 0;
        }

        .kp-name {
            flex: 1;
            font-weight: 600;
        }

        .kp-count {
            color: var(--tm);
            font-size: .85em;
        }

        .kp-bar {
            width: 70px;
            height: 8px;
            background: #eef0f8;
            border-radius: 6px;
            overflow: hidden;
        }

        .kp-bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #f97316);
            border-radius: 6px;
        }

        .wrong-question-item {
            background: rgba(239, 68, 68, 0.05);
            border-left: 4px solid var(--r);
            padding: 16px 18px;
            margin-bottom: 14px;
            border-radius: 0 14px 14px 0;
        }

        .wq-head {
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .wq-tag {
            font-size: .75em;
            background: rgba(239, 68, 68, 0.12);
            color: #c2410c;
            padding: 2px 10px;
            border-radius: 12px;
        }

        .wrong-answer {
            color: #dc2626;
            margin: 4px 0;
            font-size: .92em;
        }

        .correct-answer {
            color: #059669;
            margin: 4px 0;
            font-size: .92em;
        }

        .explanation {
            color: var(--tm);
            font-size: .9em;
            margin-top: 10px;
            line-height: 1.8;
            background: rgba(255, 255, 255, 0.6);
            padding: 10px 14px;
            border-radius: 10px;
        }

        .no-wrong {
            padding: 22px;
            text-align: center;
            color: var(--ok);
            background: rgba(16, 185, 129, 0.07);
            border-radius: 16px;
            font-weight: 600;
        }

        .summary-box {
            background: #fafbff;
            border: 1px solid rgba(102, 126, 234, 0.12);
            border-radius: 16px;
            padding: 20px;
            line-height: 1.9;
        }

        .highlight-item {
            display: inline-block;
            background: rgba(102, 126, 234, 0.12);
            color: var(--h);
            padding: 4px 14px;
            border-radius: 16px;
            margin: 4px;
            font-size: .85em;
            font-weight: 600;
        }

        .plan-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.09), rgba(118, 75, 162, 0.09));
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 14px;
        }

        .plan-title {
            font-weight: 800;
            font-size: 1.05em;
            color: var(--h);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .plan-list {
            list-style: none;
            display: grid;
            gap: 10px;
        }

        .plan-list li {
            display: flex;
            gap: 12px;

<script>
        // ==================== 全局变量 ====================
        var currentQuestionIndex = 0;
        var userAnswers = [];
        var timerInterval = null;
        var remainingTime = 1800;
        var studentInfo = { name: '', grade: '', school: '', gender: '', subject: '' };
        var quizStartTime = 0;

        // 维度配置
        var dimensions = [
            { id: 'perception', name: '空间感知', short: '感知', icon: '📐', color: '#667eea', subjects: '立体几何、空间向量、坐标系', description: '三维坐标系与点线面关系' },
            { id: 'rotation', name: '心理旋转', short: '旋转', icon: '🔄', color: '#8b5cf6', subjects: '旋转体、机械制图、物理运动', description: '复杂立体图形旋转能力' },
            { id: 'visualization', name: '空间可视化', short: '可视化', icon: '✂️', color: '#06b6d4', subjects: '截面分析、展开图、化学分子结构', description: '截面分析与展开图' },
            { id: 'reasoning', name: '空间推理', short: '推理', icon: '🧠', color: '#f59e0b', subjects: '立体几何证明、空间向量运算', description: '立体几何证明与向量关系' },
            { id: 'orientation', name: '空间定向', short: '定向', icon: '👁️', color: '#10b981', subjects: '三视图、工程制图、地理空间', description: '多视角投影与三视图' },
            { id: 'imagination', name: '空间想象', short: '想象', icon: '🎯', color: '#ef4444', subjects: '动态变换、组合体、高等数学', description: '动态变换与组合体分析' }
        ];

        // ==================== 题目数据（60题） ====================
        var questions = [
            // ===== 空间感知 perception（10题） =====
            { dimension: 'perception', question: '在三维坐标系中，点P(3,-2,5)到原点的距离是多少？', svg: 'coordinate3d', options: ['A. √38', 'B. √34', 'C. √42', 'D. √26'], answer: 0, difficulty: 1, tag: '坐标系运算', explanation: '空间两点间的距离公式为d=√(x²+y²+z²)，代入P(3,-2,5)：√(9+4+25)=√38，故选A。' },
            { dimension: 'perception', question: '已知向量a=(2,1,-1)，b=(1,0,2)，求a·b的值', svg: 'vectors', options: ['A. 0', 'B. 1', 'C. 2', 'D. -1'], answer: 0, difficulty: 1, tag: '向量运算', explanation: '向量点积按对应坐标相乘再相加：a·b=2×1+1×0+(-1)×2=2+0-2=0，故选A。' },
            { dimension: 'perception', question: '判断：空间中两条直线，若它们在同一平面内且不相交，则一定平行。', svg: 'parallel', options: ['A. 正确', 'B. 错误', 'C. 不确定', 'D. 条件不足'], answer: 0, difficulty: 1, tag: '点线面关系', explanation: '在同一平面内且不相交的两条直线，由平面几何公理可知它们一定平行，故选A。' },
            { dimension: 'perception', question: '正方体ABCD-A₁B₁C₁D₁中，直线A₁C₁与直线BD的位置关系是？', svg: 'cube_relation', options: ['A. 平行', 'B. 垂直', 'C. 异面', 'D. 相交'], answer: 2, difficulty: 2, tag: '点线面关系', explanation: 'A₁C₁在上底面，BD在底面，两条直线不共面、不相交、不平行，属于异面直线，故选C。' },
            { dimension: 'perception', question: '点P(2,3,1)到平面x+2y+2z-6=0的距离为？', svg: 'plane_distance', options: ['A. 1', 'B. 4/3', 'C. 2', 'D. √2'], answer: 1, difficulty: 2, tag: '线面距离', explanation: '点到平面距离公式：d=|Ax₀+By₀+Cz₀+D|/√(A²+B²+C²)，代入得|2+6+2-6|/√(1+4+4)=4/3，故选B。' },
            { dimension: 'perception', question: '下列哪个向量与平面2x-y+3z=0垂直？', svg: 'perpendicular', options: ['A. (2,-1,3)', 'B. (1,2,0)', 'C. (3,0,-2)', 'D. (1,1,1)'], answer: 0, difficulty: 2, tag: '法向量', explanation: '与平面垂直的向量为该平面的法向量，其坐标就是平面方程中x、y、z的系数(2,-1,3)，故选A。' },
            { dimension: 'perception', question: '四面体OABC中，O为原点，A(1,0,0)，B(0,1,0)，C(0,0,1)，其外接球半径为？', svg: 'tetrahedron', options: ['A. √3/2', 'B. √6/4', 'C. √2/2', 'D. √3/4'], answer: 0, difficulty: 3, tag: '外接球', explanation: '四个顶点到球心距离相等，球心为(1/2,1/2,1/2)，半径R=√[(1/2)²+(1/2)²+(1/2)²]=√3/2，故选A。' },
            { dimension: 'perception', question: '空间直角坐标系中，平面α: x+y+z=3与平面β: x+2y+2z=5的交线方程是？', svg: 'plane_intersect', options: ['A. x=1，y+z=2', 'B. x=y=z', 'C. x-1=y-1=z-1', 'D. y=z，x=0'], answer: 0, difficulty: 3, tag: '交线', explanation: '两式相减得y+z=2，代入α得x+2=3即x=1，所以交线为x=1且y+z=2，故选A。' },
            { dimension: 'perception', question: '正方体中，连接一个顶点与对面中心形成的直线，与该顶点相邻的三条棱所成角的余弦值分别为？', svg: 'cube_angle', options: ['A. √6/6，√6/6，√6/3', 'B. √3/3，√3/3，√3/3', 'C. √6/6，√6/6，√6/6', 'D. √2/2，√2/2，√2/2'], answer: 0, difficulty: 3, tag: '线线夹角', explanation: '设棱长1，顶点A=(0,0,0)，对面中心G=(1/2,1/2,1)，方向(1,1,2)。与三条棱的夹角余弦分别为1/√6、1/√6、2/√6，即√6/6、√6/6、√6/3，故选A。' },
            { dimension: 'perception', question: '已知向量a=(1,-2,2)，则|a|（向量a的模）为？', svg: 'vectors', options: ['A. 2', 'B. 3', 'C. 4', 'D. √5'], answer: 1, difficulty: 2, tag: '向量运算', explanation: '向量的模为各分量平方和的算术平方根：|a|=√(1+4+4)=√9=3，故选B。' },

            // ===== 心理旋转 rotation（10题） =====
            { dimension: 'rotation', question: '将正方体绕过上下底面中心的竖直轴顺时针旋转90°，原来正对前方的一面会转到哪个方向？', svg: 'cube_rotate_diagonal', options: ['A. 左面', 'B. 右面', 'C. 后面', 'D. 底面'], answer: 1, difficulty: 2, tag: '旋转变换', explanation: '从上方俯视，顺时针旋转90°时，正前方一面依次转到右侧：前→右→后→左，所以前面转到右面，故选B。' },
            { dimension: 'rotation', question: '正四棱锥P-ABCD（底面正方形，O为底面中心）绕高PO顺时针旋转90°后，顶点B将落在哪个位置？', svg: 'pyramid_rotate', options: ['A. 顶点C的位置', 'B. 顶点D的位置', 'C. 顶点A的位置', 'D. 位置不变'], answer: 0, difficulty: 3, tag: '旋转变换', explanation: '正四棱锥绕高旋转90°时，底面四个顶点依次轮换：A→B，B→C，所以B转到C的位置，故选A。' },
            { dimension: 'rotation', question: '将长4cm、宽3cm的矩形纸片以长为轴旋转一周，形成的圆柱体积为？', svg: 'cuboid_rotate', options: ['A. 36π', 'B. 48π', 'C. 27π', 'D. 12π'], answer: 0, difficulty: 2, tag: '旋转体', explanation: '以长4为轴旋转，圆柱高h=4、底面半径r=3，体积V=πr²h=π×9×4=36π，故选A。' },
            { dimension: 'rotation', question: '正六棱柱绕中心轴旋转多少度后，与原位置重合？', svg: 'hex_prism', options: ['A. 30°', 'B. 45°', 'C. 60°', 'D. 90°'], answer: 2, difficulty: 2, tag: '旋转对称', explanation: '正六棱柱底面是正六边形，旋转60°（360°÷6）后底面与自身重合，从而整个棱柱重合，故选C。' },
            { dimension: 'rotation', question: '将正四面体绕连接一个顶点与其对面中心的直线旋转120°后，能否与原位置重合？', svg: 'tetrahedron_flip', options: ['A. 能重合', 'B. 不能重合', 'C. 部分重合', 'D. 无法确定'], answer: 0, difficulty: 3, tag: '旋转对称', explanation: '正四面体绕顶点与对面中心连线旋转120°，恰为该四面体的旋转对称变换，旋转后与原位置重合，故选A。' },
            { dimension: 'rotation', question: '正方体ABCDEFGH，绕AC边（面对角线）旋转，C会转到哪个位置？', svg: 'cube_rotate_face', options: ['A. B的位置', 'B. H的位置', 'C. E的位置', 'D. 仍在C'], answer: 3, difficulty: 2, tag: '旋转变换', explanation: 'C点恰在旋转轴AC上，旋转过程中轴上的点位置不变，所以C仍在原位置，故选D。' },
            { dimension: 'rotation', question: '圆柱的高为h，底面半径为r，用通过轴线的平面截圆柱，所得截面是？', svg: 'cylinder_section', options: ['A. 圆形', 'B. 矩形', 'C. 椭圆', 'D. 抛物线'], answer: 1, difficulty: 1, tag: '旋转体', explanation: '过圆柱轴线的截面是一个矩形，长为高h、宽为底面直径2r，故选B。' },
            { dimension: 'rotation', question: '将正方形绕其一边旋转360°，形成的几何体侧面积公式是？', svg: 'square_rotate', options: ['A. 2πr²', 'B. πr²h', 'C. 2πrh', 'D. πrl'], answer: 2, difficulty: 1, tag: '旋转体', explanation: '正方形绕一边旋转形成圆柱，侧面积=底面周长×高=2πrh，故选C。' },
            { dimension: 'rotation', question: '将半圆绕其直径旋转一周，形成的立体图形是？', svg: 'sphere_rotate', options: ['A. 球', 'B. 圆柱', 'C. 圆锥', 'D. 圆台'], answer: 0, difficulty: 1, tag: '旋转体', explanation: '半圆以直径为轴旋转一周，圆弧扫出的轨迹正好围成一个球体，故选A。' },
            { dimension: 'rotation', question: '将等边三角形绕其中一条边旋转一周，形成的旋转体是？', svg: 'tri_rotate', options: ['A. 圆锥', 'B. 圆柱', 'C. 两个共底圆锥', 'D. 球'], answer: 2, difficulty: 3, tag: '旋转体', explanation: '等边三角形绕底边旋转一周，两条腰分别扫出以A、B为顶点的两个圆锥侧面，二者共用一个底面圆，形成两个共底圆锥，故选C。' },

            // ===== 空间可视化 visualization（10题） =====
            { dimension: 'visualization', question: '正方体的展开图中，以下哪种排列不能围成正方体？', svg: 'cube_net', options: ['A. 十字形（中间4个）', 'B. 田字形', 'C. 1-4-1形', 'D. 3-3-1形'], answer: 1, difficulty: 1, tag: '展开图', explanation: '田字形（2×2）四个面共用一个顶点，折叠时四个面会挤在一起、无法构成六面体，不能围成正方体，故选B。' },
            { dimension: 'visualization', question: '用一个平面截正方体，截面不可能是什么形状？', svg: 'cube_section_types', options: ['A. 三角形', 'B. 五边形', 'C. 六边形', 'D. 七边形'], answer: 3, difficulty: 2, tag: '截面', explanation: '一个平面最多与正方体6个面相交，所以截面最多六边形，不可能出现七边形，故选D。' },
            { dimension: 'visualization', question: '斜截圆柱（平面不垂直于轴、不过轴），其截面形状是？', svg: 'cylinder_slant', options: ['A. 圆形', 'B. 矩形', 'C. 椭圆', 'D. 抛物线'], answer: 2, difficulty: 2, tag: '截面', explanation: '平面与圆柱侧面的所有母线相交且不垂直，截面为椭圆，故选C。' },
            { dimension: 'visualization', question: '用平行于底面的平面在距顶点h/2处截正四面体（h为高），上方小四面体与原四面体体积之比为？', svg: 'tetrahedron_cut', options: ['A. 1:8', 'B. 1:27', 'C. 1:64', 'D. 1:9'], answer: 0, difficulty: 2, tag: '截面', explanation: '小四面体与原四面体相似，相似比为1:2，体积比=相似比³=1:8，故选A。' },
            { dimension: 'visualization', question: '正方体展开图中，中间一行4个正方形、上下各1个的排列属于哪种类型？', svg: 'net_141', options: ['A. 1-4-1型', 'B. 2-3-1型', 'C. 3-3型', 'D. 2-2-2型'], answer: 0, difficulty: 1, tag: '展开图', explanation: '中间一行4个、上下各1个，正是标准的1-4-1型正方体展开图，故选A。' },
            { dimension: 'visualization', question: '将圆锥侧面展开，扇形的圆心角公式为？', svg: 'cone_unfold', options: ['A. r/h × 180°', 'B. r/l × 360°', 'C. h/r × 180°', 'D. l/r × 360°'], answer: 1, difficulty: 1, tag: '展开图', explanation: '扇形弧长等于圆锥底面周长2πr，而扇形所在圆周长2πl，圆心角=2πr/2πl×360°=r/l×360°，故选B。' },
            { dimension: 'visualization', question: '用一个距球心R/2的平面截半径为R的球，截面圆面积与球大圆面积之比为？', svg: 'sphere_section', options: ['A. 1:2', 'B. 3:4', 'C. 1:4', 'D. √3:2'], answer: 1, difficulty: 3, tag: '截面', explanation: '截面圆半径r=√(R²-(R/2)²)=√3R/2，面积比=(√3/2)²=3/4，故选B。' },
            { dimension: 'visualization', question: '正三棱柱的侧面（不含上下底面）展开后，整体是？', svg: 'tri_prism_net', options: ['A. 平行四边形', 'B. 矩形', 'C. 三角形', 'D. 梯形'], answer: 1, difficulty: 2, tag: '展开图', explanation: '三棱柱的3个矩形侧面并排展开，拼成一个大的矩形，故选B。' },
            { dimension: 'visualization', question: '正方体的截面图形中，最多有几条边？', svg: 'cube_section_max', options: ['A. 4条', 'B. 5条', 'C. 6条', 'D. 7条'], answer: 2, difficulty: 3, tag: '截面', explanation: '截面最多与正方体6个面各交出一条边，形成六边形，故选C。' },
            { dimension: 'visualization', question: '正方体被一个过体对角线且垂直于底面的平面所截，截面形状是？', svg: 'cube_diag_section', options: ['A. 矩形', 'B. 三角形', 'C. 五边形', 'D. 梯形'], answer: 0, difficulty: 3, tag: '截面', explanation: '过体对角线且垂直底面的平面截正方体，截面为矩形（宽为面对角线、高为棱长），故选A。' },

            // ===== 空间推理 reasoning（10题） =====
            { dimension: 'reasoning', question: '已知三棱锥P-ABC中，PA⊥BC，PB⊥AC，则PC与AB的关系是？', svg: 'pyramid_perp', options: ['A. 垂直', 'B. 平行', 'C. 异面垂直', 'D. 无法确定'], answer: 2, difficulty: 1, tag: '立体几何证明', explanation: '由PA⊥BC、PB⊥AC可推得PC⊥AB（垂心定理），且PC与AB为异面直线，故为异面垂直，故选C。' },
            { dimension: 'reasoning', question: '空间中到两个定点距离相等的点的集合是？', svg: 'locus_2points', options: ['A. 一个点', 'B. 一条直线', 'C. 垂直平分面', 'D. 一个球面'], answer: 2, difficulty: 1, tag: '轨迹问题', explanation: '空间中到两点距离相等的点的轨迹是这两点的垂直平分面，故选C。' },
            { dimension: 'reasoning', question: '正方体ABCD-A₁B₁C₁D₁中，直线A₁B与直线BC₁所成角的余弦值为？', svg: 'cube_angle_calc', options: ['A. √2/2', 'B. √3/3', 'C. 1/2', 'D. √6/3'], answer: 2, difficulty: 2, tag: '线线夹角', explanation: '取向量A₁B=(1,0,-1)、BC₁=(0,1,1)，cosθ=|0+0-1|/(√2×√2)=1/2，故选C。' },
            { dimension: 'reasoning', question: '三余弦定理的正确表达是？（θ为斜线与平面内直线m的夹角，θ₁为线面角，θ₂为射影与m的夹角）', svg: 'angle_relation', options: ['A. cosθ=cosθ₁·cosθ₂', 'B. sinθ=sinθ₁·sinθ₂', 'C. tanθ=tanθ₁·tanθ₂', 'D. cosθ=sinθ₁·sinθ₂'], answer: 0, difficulty: 2, tag: '线面角', explanation: '三余弦定理：斜线与平面内直线所成角的余弦=线面角余弦×射影与直线夹角余弦，即cosθ=cosθ₁·cosθ₂，故选A。' },
            { dimension: 'reasoning', question: '长方体的一条体对角线与交于同一顶点的三条棱所成角分别为α、β、γ，则cos²α+cos²β+cos²γ=？', svg: 'cuboid_diag_angle', options: ['A. 1', 'B. 2', 'C. 3', 'D. 0'], answer: 0, difficulty: 3, tag: '空间向量', explanation: '设三棱长a、b、c，对角线长d=√(a²+b²+c²)，cos²α=a²/d²、cos²β=b²/d²、cos²γ=c²/d²，三者之和=(a²+b²+c²)/d²=1，故选A。' },
            { dimension: 'reasoning', question: '在四棱锥V-ABCD中，底面为正方形，VA=VB=VC=VD，则V在底面的射影是？', svg: 'pyramid_foot', options: ['A. 底面中心（对角线交点）', 'B. AB边的中点', 'C. 某顶点', 'D. 无法确定'], answer: 0, difficulty: 2, tag: '立体几何证明', explanation: 'VA=VB=VC=VD说明V到各顶点距离相等，其射影到底面四顶点距离相等，即射影为正方形中心（对角线交点），故选A。' },
            { dimension: 'reasoning', question: '已知a·b=0，a·c=3，b·c=4，|a|=1，|b|=2，则(a+2b)·(3c)=？', svg: 'vector_calc', options: ['A. 21', 'B. 33', 'C. 27', 'D. 36'], answer: 1, difficulty: 2, tag: '向量运算', explanation: '(a+2b)·(3c)=3a·c+6b·c=3×3+6×4=9+24=33，故选B。' },
            { dimension: 'reasoning', question: '正四面体ABCD中，棱AB与棱CD的位置关系是？', svg: 'tetra_edges', options: ['A. 平行', 'B. 垂直', 'C. 异面垂直', 'D. 相交'], answer: 2, difficulty: 1, tag: '异面直线', explanation: '正四面体的相对棱（AB与CD）为异面直线且相互垂直，故选C。' },
            { dimension: 'reasoning', question: '已知向量a=(1,2,2)，b=(2,-1,0)，则a与b的夹角为？', svg: 'vectors', options: ['A. 0°', 'B. 45°', 'C. 90°', 'D. 180°'], answer: 2, difficulty: 3, tag: '向量运算', explanation: 'a·b=1×2+2×(-1)+2×0=2-2+0=0，点积为0说明两向量垂直，夹角为90°，故选C。' },
            { dimension: 'reasoning', question: '三棱锥P-ABC中，PA⊥平面ABC，∠ABC=90°，AB=BC=1，PA=1，则点P到直线BC的距离为？', svg: 'pyramid_dist', options: ['A. √2', 'B. √6/2', 'C. 1', 'D. √3'], answer: 0, difficulty: 3, tag: '立体几何证明', explanation: 'BC⊥AB且BC⊥PA，所以BC⊥平面PAB，BC⊥PB，故P到BC的距离即PB=√(PA²+AB²)=√(1+1)=√2，故选A。' },

            // ===== 空间定向 orientation（10题） =====
            { dimension: 'orientation', question: '根据三视图数据（正视图、侧视图、俯视图均为2×2方格），这个几何体最多由几个小立方体组成？', svg: 'three_view_cubes', options: ['A. 8个', 'B. 9个', 'C. 10个', 'D. 11个'], answer: 0, difficulty: 3, tag: '三视图', explanation: '三个视图都是2×2，说明立体占据2×2×2的空间范围，最多（也恰好）为8个小立方体，故选A。' },
            { dimension: 'orientation', question: '正等测投影中，水平圆的正等轴测图是什么形状？', svg: 'isometric_circle', options: ['A. 圆', 'B. 椭圆', 'C. 抛物线', 'D. 直线'], answer: 1, difficulty: 1, tag: '正等测', explanation: '正等测投影将水平面的圆投影为椭圆（轴测投影后圆形变为椭圆），故选B。' },
            { dimension: 'orientation', question: '一个几何体的正视图和侧视图都是三角形，俯视图是圆，这个几何体是？', svg: 'views_shape', options: ['A. 圆锥', 'B. 三棱锥', 'C. 半球', 'D. 圆柱'], answer: 0, difficulty: 2, tag: '三视图', explanation: '圆锥的主视、侧视均为三角形，俯视为圆；三棱锥俯视为三角形，圆柱正侧视为矩形，故选A。' },
            { dimension: 'orientation', question: '斜二测画法中，y轴与x轴的夹角是？', svg: 'oblique_axis', options: ['A. 30°', 'B. 45°', 'C. 60°', 'D. 90°'], answer: 1, difficulty: 2, tag: '斜二测', explanation: '斜二测画法规定y轴与x轴成45°角，z轴竖直，故选B。' },
            { dimension: 'orientation', question: '一个几何体的三视图完全相同，这个几何体可能是？', svg: 'same_views', options: ['A. 圆柱', 'B. 正方体', 'C. 球', 'D. 以上都有可能'], answer: 3, difficulty: 3, tag: '三视图', explanation: '球的三视图都是圆，正方体从正对面的方向看三视图都是正方形，二者都有可能，故选D。' },
            { dimension: 'orientation', question: '斜二测画法中，平行于y轴的线段长度变换比例为？', svg: 'oblique_scale', options: ['A. 1:1', 'B. 1:2', 'C. 2:1', 'D. 1:√2'], answer: 1, difficulty: 2, tag: '斜二测', explanation: '斜二测画法中平行于y轴的线段长度变为原来的一半（即1:2），故选B。' },
            { dimension: 'orientation', question: '在正视图中表现为一条线的几何元素，在空间中可能是？', svg: 'view_line', options: ['A. 直线', 'B. 平面', 'C. 直线或平面', 'D. 无法确定'], answer: 2, difficulty: 2, tag: '投影', explanation: '一条直线可能投影成一条线，一个平面也可能因垂直投影而收缩成一条线，故选C。' },
            { dimension: 'orientation', question: '由8个棱长为a的小正方体组成的2×2×2大正方体，其表面积为？', svg: 'views_surface', options: ['A. 16a²', 'B. 20a²', 'C. 24a²', 'D. 32a²'], answer: 2, difficulty: 3, tag: '三视图', explanation: '大正方体边长为2a，每个面面积4a²，共6个面，表面积=6×4a²=24a²，故选C。' },
            { dimension: 'orientation', question: '斜二测画法中，平行于x轴的线段，其长度如何处理？', svg: 'oblique_scale', options: ['A. 长度不变', 'B. 长度减半', 'C. 长度加倍', 'D. 变为√2倍'], answer: 0, difficulty: 1, tag: '斜二测', explanation: '斜二测画法中平行于x轴的线段长度保持不变，只有平行于y轴的线段才缩短一半，故选A。' },
            { dimension: 'orientation', question: '某几何体的正视图、侧视图、俯视图都是圆，这个几何体是？', svg: 'views_sphere', options: ['A. 球', 'B. 圆柱', 'C. 圆锥', 'D. 圆台'], answer: 0, difficulty: 1, tag: '三视图', explanation: '球从任何方向的正投影都是圆，三视图均为圆的只有球，故选A。' },

            // ===== 空间想象 imagination（10题） =====
            { dimension: 'imagination', question: '将一个正方体切去一个角，所得几何体最多有几条棱？', svg: 'cube_cut_corner', options: ['A. 12条', 'B. 15条', 'C. 18条', 'D. 21条'], answer: 1, difficulty: 1, tag: '空间想象', explanation: '正方体原有12条棱，切去一个角产生三角形截面增加3条棱，共12+3=15条，故选B。' },
            { dimension: 'imagination', question: '3×3×3的大正方体挖去正中心1个小正方体后，表面积如何变化？', svg: 'cube_hollow', options: ['A. 不变', 'B. 增加', 'C. 减少', 'D. 无法确定'], answer: 1, difficulty: 2, tag: '组合体', explanation: '挖去中心块后，内部6个面全部裸露出来，新增6a²的面积，表面积增加，故选B。' },
            { dimension: 'imagination', question: '将长、宽、高分别为a、b、h的长方体切成两个全等三棱柱，有几种切法？', svg: 'cuboid_cut_prism', options: ['A. 2种', 'B. 3种', 'C. 4种', 'D. 无数种'], answer: 1, difficulty: 2, tag: '空间想象', explanation: '沿三个方向（对应三条棱的方向）的对角面各切一次，共3种切法，故选B。' },
            { dimension: 'imagination', question: '正四棱锥P-ABCD的底面边长为2，侧棱长为3，其外接球半径为？', svg: 'pyramid_in_sphere', options: ['A. 9√7/14', 'B. √7/2', 'C. √6/2', 'D. 3/2'], answer: 0, difficulty: 3, tag: '外接球', explanation: '底面外接圆半径√2、锥高√7，设球心距底面d，则d²+2=(√7-d)²得d=5/(2√7)，R=√(d²+2)=9√7/14，故选A。' },
            { dimension: 'imagination', question: '骰子相对两面数字之和为7。数字1所在面的所有相邻面的数字之和是？', svg: 'dice_unfold', options: ['A. 8', 'B. 10', 'C. 12', 'D. 14'], answer: 3, difficulty: 3, tag: '空间想象', explanation: '1的对面是6，故与1相邻的四个面为2、3、4、5，和为2+3+4+5=14，故选D。' },
            { dimension: 'imagination', question: '在正方体ABCD-A₁B₁C₁D₁中，一只蚂蚁从A点沿表面爬到C₁点，最短路程是棱长a的多少倍？', svg: 'ant_path', options: ['A. √2倍', 'B. √3倍', 'C. √5倍', 'D. √6倍'], answer: 2, difficulty: 2, tag: '展开图', explanation: '将正方体表面展开，A与C₁的直线距离为√(a²+(2a)²)=√5a，即√5倍棱长，故选C。' },
            { dimension: 'imagination', question: '将圆柱沿一条母线剪开并展开，其侧面展开图是？', svg: 'cylinder_unfold', options: ['A. 矩形', 'B. 扇形', 'C. 梯形', 'D. 圆'], answer: 0, difficulty: 1, tag: '展开图', explanation: '圆柱侧面沿母线剪开平铺，展开为矩形（长为底面周长、宽为高），故选A。' },
            { dimension: 'imagination', question: '用一个平面切正方体（一刀），最多能把正方体分成几个部分？', svg: 'cube_cut_parts', options: ['A. 2个', 'B. 3个', 'C. 4个', 'D. 5个'], answer: 0, difficulty: 1, tag: '截面', explanation: '一个平面最多把空间分成两部分，故一刀切正方体最多分成2个部分，故选A。' },
            { dimension: 'imagination', question: '一个球沿过球心的平面切成两半，每个半球体（含截面圆面）的表面积与原球表面积之比为？', svg: 'hemisphere', options: ['A. 2:3', 'B. 3:4', 'C. 1:2', 'D. 4:5'], answer: 1, difficulty: 2, tag: '旋转体', explanation: '半球表面积=2πR²(曲面)+πR²(截面)=3πR²，原球表面积=4πR²，比为3:4，故选B。' },
            { dimension: 'imagination', question: '在正方体中连接六个面的中心，所得八面体的体积与正方体体积之比为？', svg: 'cube_octahedron', options: ['A. 1:4', 'B. 1:6', 'C. 1:8', 'D. 1:12'], answer: 1, difficulty: 3, tag: '组合体', explanation: '六个面中心构成正八面体，其体积为正方体体积的1/6（可分解为两个四棱锥计算），故选B。' }
        ];

        // ==================== SVG图形生成函数（48个原有+9个新增） ====================
        function generateSVG(type) {

        // ==================== 页面切换 ====================
        function goToPage(pageId) {
            var pages = document.querySelectorAll('.page');
            for (var i = 0; i < pages.length; i++) {
                pages[i].className = 'page';
            }
            document.getElementById(pageId).className = 'page active';
            window.scrollTo(0, 0);
        }

        function getDimById(id) {
            for (var i = 0; i < dimensions.length; i++) {
                if (dimensions[i].id === id) return dimensions[i];
            }
            return dimensions[0];
        }

        function initWelcome() {
            var html = '';
            for (var i = 0; i < dimensions.length; i++) {
                var d = dimensions[i];
                html += '<div class="dimension-item">';
                html += '<div class="dimension-icon">' + d.icon + '</div>';
                html += '<div class="dimension-name">' + d.name + '</div>';
                html += '<div class="dimension-desc">' + d.description + '</div>';
                html += '</div>';
            }
            document.getElementById('welcomeDimGrid').innerHTML = html;
        }

        // ==================== 答题流程 ====================
        function startQuiz() {
            var name = document.getElementById('studentName').value.trim();
            studentInfo = {
                name: name || '匿名学生',
                grade: document.getElementById('studentGrade').value || '',
                school: document.getElementById('schoolName').value.trim(),
                gender: document.getElementById('studentGender').value,
                subject: document.getElementById('studentSubject').value
            };

            userAnswers = new Array(questions.length);
            for (var i = 0; i < userAnswers.length; i++) userAnswers[i] = null;
            currentQuestionIndex = 0;
            remainingTime = 1800;
            quizStartTime = new Date().getTime();

            goToPage('testPage');
            renderQuestion();
            startTimer();
        }

        function renderQuestion() {
            var q = questions[currentQuestionIndex];
            var dim = getDimById(q.dimension);

            document.getElementById('currentQ').textContent = currentQuestionIndex + 1;
            document.getElementById('totalQ').textContent = questions.length;
            document.getElementById('totalQ2').textContent = questions.length;
            document.getElementById('progressFill').style.width = ((currentQuestionIndex + 1) / questions.length * 100) + '%';

            var answeredCount = 0;
            for (var i = 0; i < userAnswers.length; i++) {
                if (userAnswers[i] !== null) answeredCount++;
            }
            document.getElementById('answeredQ').textContent = answeredCount;

            document.getElementById('dimensionBadge').textContent = dim.icon + ' ' + dim.name;
            document.getElementById('questionNumber').textContent = '第 ' + (currentQuestionIndex + 1) + ' 题 · ' + dim.name;
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('questionSvg').innerHTML = generateSVG(q.svg);

            var optionsHtml = '';
            for (var idx = 0; idx < q.options.length; idx++) {
                optionsHtml += '<div class="option-btn" id="opt_' + idx + '" onclick="selectOption(' + idx + ')">' +
                    '<span class="option-letter">' + String.fromCharCode(65 + idx) + '</span>' +
                    '<span class="option-text">' + q.options[idx].substring(3) + '</span></div>';
            }
            document.getElementById('optionsGrid').innerHTML = optionsHtml;
            document.getElementById('feedbackBox').className = 'feedback-box hidden';
            document.getElementById('feedbackBox').innerHTML = '';

            // 若该题已作答，恢复锁定与反馈状态
            if (userAnswers[currentQuestionIndex] !== null) {
                lockQuestion(userAnswers[currentQuestionIndex], true);
            }

            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').textContent = currentQuestionIndex === questions.length - 1 ? '提交答卷 ✓' : '下一题 →';
        }

        function selectOption(idx) {
            if (userAnswers[currentQuestionIndex] !== null) return;
            userAnswers[currentQuestionIndex] = idx;
            lockQuestion(idx, false);
        }

        function lockQuestion(idx, isRestore) {
            var q = questions[currentQuestionIndex];
            var options = document.querySelectorAll('.option-btn');
            var correctIdx = q.answer;

            for (var i = 0; i < options.length; i++) {
                options[i].classList.add('locked');
                options[i].setAttribute('onclick', '');
                if (i === idx) {
                    options[i].classList.add('selected');
                    if (i === correctIdx) {
                        options[i].classList.add('correct');
                    } else {
                        options[i].classList.add('wrong');
                    }
                }
                if (i === correctIdx && idx !== correctIdx) {
                    options[i].classList.add('correct');
                }
            }

            // 显示即时反馈
            var fb = document.getElementById('feedbackBox');
            var isCorrect = idx === correctIdx;
            if (isCorrect) {
                fb.className = 'feedback-box feedback-correct';

                fb.className = 'feedback-box feedback-wrong';
                fb.innerHTML = '<div class="fb-title">✗ 回答错误</div>' +
                    '<div>正确答案：' + q.options[correctIdx] + '</div>' +
                    '<div class="fb-exp">💡 ' + q.explanation + '</div>';
            }
            fb.style.display = 'block';

            // 更新已答数量
            var answeredCount = 0;
            for (var i = 0; i < userAnswers.length; i++) {
                if (userAnswers[i] !== null) answeredCount++;
            }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) {
                alert('请先选择本题的答案');
                return;
            }
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                submitQuiz();
            }
        }

        // ==================== 计时 ====================
        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(function() {
                remainingTime--;
                updateTimerDisplay();
                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            var minutes = Math.floor(remainingTime / 60);
            var seconds = remainingTime % 60;
            document.getElementById('timeDisplay').textContent =
                (minutes < 10 ? '0' : '') + minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
        }

        function getElapsedText() {
            var sec = Math.round((new Date().getTime() - quizStartTime) / 1000);
            if (sec < 60) return sec + '秒';
            var m = Math.floor(sec / 60);
            var s = sec % 60;
            return m + '分' + (s < 10 ? '0' : '') + s + '秒';
        }

        // ==================== 评分与辅助 ====================

        }

        function getLevel(p) {
            if (p >= 80) return { level: '强', cls: 'level-strong' };
            if (p >= 50) return { level: '中', cls: 'level-medium' };
            return { level: '弱', cls: 'level-weak' };
        }

        function getLevelText(p) {
            if (p >= 80) return '表现出色，空间直觉敏锐，能够快速完成立体几何与空间向量的复杂想象任务。';
            if (p >= 50) return '基础扎实，但面对高考立体几何压轴与复杂空间关系时仍有一定提升空间。';
            return '较为薄弱，需要加强基本图形感知与立体想象训练，打好立体几何基础。';
        }

        function calculateAllScores() {
            var dimScores = {};
            var dimMax = {};
            var dimCorrect = {};
            for (var i = 0; i < dimensions.length; i++) {
                dimScores[dimensions[i].id] = 0;
                dimMax[dimensions[i].id] = 0;
                dimCorrect[dimensions[i].id] = 0;
            }
            var totalScore = 0;
            var totalMax = 0;
            var totalCorrect = 0;

            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                dimMax[q.dimension] += q.difficulty;
                totalMax += q.difficulty;
                if (userAnswers[i] !== null && userAnswers[i] === q.answer) {
                    dimScores[q.dimension] += q.difficulty;
                    dimCorrect[q.dimension]++;
                    totalScore += q.difficulty;
                    totalCorrect++;
                }
            }

            var dims = {};
            for (var i = 0; i < dimensions.length; i++) {
                var d = dimensions[i];
                var max = dimMax[d.id];
                dims[d.id] = {
                    name: d.name,
                    short: d.short,
                    icon: d.icon,
                    color: d.color,
                    subjects: d.subjects,
                    score: dimScores[d.id],
                    maxScore: max,
                    correct: dimCorrect[d.id],
                    total: 10,
                    percentage: max > 0 ? Math.round(dimScores[d.id] / max * 100) : 0
                };
            }

            return {
                dimensions: dims,
                totalScore: totalScore,
                totalMaxScore: totalMax,
                overallPercentage: totalMax > 0 ? Math.round(totalScore / totalMax * 100) : 0,
                totalCorrect: totalCorrect,
                totalQuestions: questions.length
            };
        }

        // ==================== 图表绘制 ====================
        function drawRing(canvasEl, pct, color) {
            var c = canvasEl;
            var ctx = c.getContext('2d');
            var size = 190, cx = size / 2, cy = size / 2, r = 78;
            c.width = size;
            c.height = size;
            ctx.clearRect(0, 0, size, size);
            ctx.lineWidth = 16;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(100,116,139,.12)';
            ctx.stroke();
            var start = -Math.PI / 2;
            var end = start + Math.PI * 2 * pct / 100;
            var grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#667eea');
            grad.addColorStop(1, '#764ba2');
            ctx.strokeStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, r, start, end);
            ctx.stroke();
        }

        function drawRadar(canvasEl, scores) {
            var c = canvasEl;
            var ctx = c.getContext('2d');
            var size = 340, cx = size / 2, cy = size / 2, r = 118, n = 6;
            c.width = size;
            c.height = size;
            var keys = [];
            var labels = [];
            var colors = [];
            for (var id in scores.dimensions) {
                keys.push(id);
                labels.push(scores.dimensions[id].short);
                colors.push(scores.dimensions[id].color);
            }
            var step = Math.PI * 2 / n;
            ctx.strokeStyle = 'rgba(100,116,139,.16)';
            ctx.lineWidth = 1;
            for (var l = 1; l <= 5; l++) {
                ctx.beginPath();
                var rr = r * l / 5;
                for (var i = 0; i <= n; i++) {
                    var a = step * i - Math.PI / 2;
                    var x = cx + rr * Math.cos(a);
                    var y = cy + rr * Math.sin(a);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            }
            for (var i = 0; i < n; i++) {
                var a = step * i - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
                ctx.stroke();
            }
            var pts = [];
            ctx.beginPath();
            for (var i = 0; i < n; i++) {
                var pct = scores.dimensions[keys[i]].percentage;
                var rr = r * pct / 100;
                var a = step * i - Math.PI / 2;
                var x = cx + rr * Math.cos(a);
                var y = cy + rr * Math.sin(a);
                pts.push({ x: x, y: y });
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            var grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, 'rgba(102,126,234,.4)');
            grad.addColorStop(1, 'rgba(118,75,162,.3)');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            for (var i = 0; i < pts.length; i++) {
                ctx.beginPath();
                ctx.arc(pts[i].x, pts[i].y, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#667eea';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            for (var i = 0; i < n; i++) {
                var a = step * i - Math.PI / 2;
                var x = cx + (r + 26) * Math.cos(a);
                var y = cy + (r + 26) * Math.sin(a);
                ctx.fillStyle = '#334155';
                ctx.fillText(labels[i], x, y);
                ctx.fillStyle = colors[i];
                ctx.fillText(scores.dimensions[keys[i]].percentage + '%', x, y + 17);
            }
            return c;
        }

        function drawBar(canvasEl, scores) {
            var c = canvasEl;
            var ctx = c.getContext('2d');
            var w = 460, h = 230;
            c.width = w;
            c.height = h;
            var keys = [];
            var labels = [];
            var colors = [];
            for (var id in scores.dimensions) {
                keys.push(id);
                labels.push(scores.dimensions[id].short);
                colors.push(scores.dimensions[id].color);
            }
            var bw = 46, gap = 26, sx = 40, sy = h - 40, maxH = 130;
            ctx.font = 'bold 12px sans-serif';
            for (var i = 0; i < keys.length; i++) {
                var pct = scores.dimensions[keys[i]].percentage;
                var bh = maxH * pct / 100;
                var x = sx + i * (bw + gap);
                var grad = ctx.createLinearGradient(0, sy - bh, 0, sy);
                grad.addColorStop(0, colors[i]);
                grad.addColorStop(1, colors[i] + '88');
                ctx.fillStyle = grad;
                ctx.fillRect(x, sy - bh, bw, bh);
                ctx.fillStyle = '#334155';
                ctx.textAlign = 'center';
                ctx.fillText(pct + '%', x + bw / 2, sy - bh - 8);
                ctx.fillStyle = '#64748b';
                ctx.font = '11px sans-serif';
                ctx.fillText(labels[i], x + bw / 2, sy + 18);
                ctx.font = 'bold 12px sans-serif';
            }
            ctx.strokeStyle = 'rgba(100,116,139,.15)';
            ctx.beginPath();
            ctx.moveTo(sx - 5, sy);
            ctx.lineTo(w - 10, sy);
            ctx.stroke();
            return c;
        }

        function submitQuiz() {

        function getWrongList() {
            var wrongs = [];
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                if (userAnswers[i] !== null && userAnswers[i] !== q.answer) {
                    var dim = getDimById(q.dimension);
                    wrongs.push({ qi: i, q: q, ua: userAnswers[i], dimName: dim.name, short: dim.short, color: dim.color });
                }
            }
            return wrongs;
        }

        function buildKpCluster(wrongs) {
            var map = {};
            for (var i = 0; i < wrongs.length; i++) {
                var tag = wrongs[i].q.tag;
                if (!map[tag]) map[tag] = { tag: tag, count: 0, names: [] };
                map[tag].count++;
                if (map[tag].names.indexOf(wrongs[i].short) < 0) map[tag].names.push(wrongs[i].short);
            }
            var arr = [];
            for (var t in map) arr.push(map[t]);
            arr.sort(function (a, b) { return b.count - a.count; });
            return arr;
        }

        function getSubjectAdvice(scores) {
            var s = [], d = [];
            for (var id in scores.dimensions) {
                var dim = scores.dimensions[id];
                if (dim.percentage >= 80) s.push(dim.name);
                if (dim.percentage < 55) d.push(dim.name);
            }
            return { s: s, d: d };
        }

        function doLogin() {
            var u = document.getElementById('loginUser').value.trim();

            var err = document.getElementById('loginError');
            if (u === '' || p === '') {
                err.textContent = '请输入账号和密码';
                return;
            }
            if (u === LOGIN_USER && p === LOGIN_PASS) {
                sessionStorage.setItem('sys_login_ok', '1');
                document.getElementById('loginOverlay').style.display = 'none';
                initWelcome();
            } else {
                err.textContent = '账号或密码错误，请重新输入';
                document.getElementById('loginPass').value = '';
            }
        }

        function checkLogin() {
            var ok = sessionStorage.getItem('sys_login_ok');
            if (ok === '1') {
                document.getElementById('loginOverlay').style.display = 'none';
                initWelcome();
            }
        }

                if (overlay && overlay.style.display !== 'none') {
                    doLogin();
                }
            }
