<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初二空间思维检测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --p: #ffffff;
            --s: #f6f8ff;
            --a: #eef1ff;
            --h: #667eea;
            --h2: #764ba2;
            --t: #1e293b;
            --tm: #64748b;
            --ok: #10b981;
            --w: #f59e0b;
            --r: #ef4444;
            --gl: #a8c0ff;
            --gp: #c4b5fd;
            --grad: linear-gradient(135deg, #667eea 0%, #764ba2 55%, #f093fb 100%);
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--grad);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--t);
            overflow-x: hidden;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn .5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glowPulse {
            0%, 100% { opacity: .35; transform: scale(1); }
            50% { opacity: .6; transform: scale(1.15); }
        }

        @keyframes dimFlash {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(102,126,234,.6); }
            50% { transform: scale(1.06); box-shadow: 0 0 0 12px rgba(102,126,234,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(102,126,234,0); }
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            box-shadow: 0 18px 40px -14px rgba(0, 0, 0, 0.22);
            padding: 34px;
            margin-bottom: 18px;
            backdrop-filter: blur(8px);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 30px;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .3s ease;
            color: #fff;
            background: linear-gradient(135deg, var(--h), var(--h2));
            box-shadow: 0 10px 22px rgba(102, 126, 234, 0.35);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(102, 126, 234, 0.45);
        }

        .btn-secondary {
            background: rgba(100, 116, 139, 0.12);
            color: var(--tm);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(100, 116, 139, 0.2);
            color: var(--t);
        }

        .footer-sign {
            text-align: center;
            margin-top: 22px;
            color: rgba(255, 255, 255, 0.85);
            font-size: .88rem;
            letter-spacing: 1px;
        }

        /* ===== 登录页 ===== */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--grad);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity .4s;
        }

        .login-box {
            background: #fff;
            border-radius: 20px;
            padding: 40px 34px 30px;
            width: 320px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn .6s ease;
        }

        .login-logo svg {
            width: 86px;
            height: 86px;
            margin-bottom: 6px;
            animation: float 3s ease-in-out infinite;
        }

        .login-box h2 {
            margin: 0 0 6px;
            font-size: 22px;
            color: var(--t);
            font-weight: 800;
        }

        .login-sub {
            font-size: 12px;
            color: var(--tm);
            margin-bottom: 20px;
        }

        .login-input {
            width: 100%;
            padding: 13px 16px;
            margin: 8px 0;
            border: 1.8px solid #e5e7f0;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color .3s, box-shadow .3s;
        }

        .login-input:focus {
            border-color: var(--h);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            margin: 14px 0 8px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--h), var(--h2));
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity .3s, transform .2s;
        }

        .login-btn:hover {
            opacity: .9;
            transform: translateY(-1px);
        }

        .login-error {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            min-height: 18px;
        }

        .login-credits {
            text-align: center;
            margin-top: 14px;
            font-size: 12px;
            color: #aaa;
        }

        /* ===== 欢迎页 ===== */
        .welcome-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .welcome-icon {
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
            animation: float 3s ease-in-out infinite;
        }

        .welcome-title {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--h), var(--h2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .welcome-subtitle {
            font-size: 1.02rem;
            color: var(--tm);
            line-height: 2;
            text-align: center;
        }

        .dimension-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 26px 0;
        }

        .dimension-item {
            background: linear-gradient(135deg, #f5f7fa, #eef1ff);
            border: 1px solid rgba(102, 126, 234, 0.12);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            transition: all .3s ease;
        }

        .dimension-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.16);
        }

        .dimension-icon {
            font-size: 2rem;
            margin-bottom: 6px;
        }

        .dimension-name {
            font-weight: 700;
            color: var(--t);
            font-size: .92rem;
        }

        .dimension-desc {
            font-size: .74rem;
            color: var(--tm);
            margin-top: 4px;
            line-height: 1.6;
        }

        .welcome-footer {
            text-align: center;
            margin-top: 18px;
            color: var(--tm);
            font-size: .85rem;
        }

        /* ===== 信息页 ===== */
        .main-title {
            text-align: center;
            font-size: 1.7em;
            color: var(--t);
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--tm);
            font-size: 1em;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--tm);
            font-weight: 600;
            font-size: .92em;
        }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            background: #fafbff;
            border: 2px solid #e5e7f0;
            border-radius: 12px;
            color: var(--t);
            font-size: 1em;
            outline: none;
            transition: border-color .3s, box-shadow .3s;
        }

        .form-input:focus {
            border-color: var(--h);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-select {
            width: 100%;
            padding: 13px 16px;
            background: #fafbff;
            border: 2px solid #e5e7f0;
            border-radius: 12px;
            color: var(--t);
            font-size: 1em;
            cursor: pointer;
            outline: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 10px;
        }

        /* ===== 答题页 ===== */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .quiz-progress {
            flex: 1;
            min-width: 180px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: .88em;
            color: var(--tm);
        }

        .progress-text b {
            color: var(--h);
        }

        .progress-bar {
            height: 10px;
            background: #eef0f8;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--h), var(--h2));
            border-radius: 6px;
            transition: width .7s cubic-bezier(.4, 0, .2, 1);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 22px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 6px;
        }

        .quiz-timer {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            color: #92400e;
            font-size: .95em;
            white-space: nowrap;
        }

        .dimension-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--h), var(--h2));
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: .9rem;
            font-weight: 700;
            margin-bottom: 16px;
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.3);
        }

        .dimension-badge.flash {
            animation: dimFlash .7s ease;
        }

        .question-card {
            background: #f8fafc;
            border: 1px solid #eef0f8;
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 18px;
        }

        .question-number {
            display: inline-block;
            background: linear-gradient(135deg, var(--h), var(--h2));
            color: #fff;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: .85rem;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .question-text {
            font-size: 1.12rem;
            color: var(--t);
            line-height: 1.75;
            margin-bottom: 18px;
        }

        .question-svg {
            display: flex;
            justify-content: center;
            margin: 14px 0;
        }

        .question-svg svg {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.08));
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: #fff;
            border: 2px solid #e5e7f0;
            border-radius: 14px;
            cursor: pointer;
            transition: all .3s ease;
            text-align: left;
        }

        .option-btn:hover {
            border-color: var(--h);
            background: #f0f4ff;
        }

        .option-btn.selected {
            border-color: var(--h);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.12), rgba(118, 75, 162, 0.12));
        }

        .option-btn.correct {
            border-color: var(--ok);
            background: rgba(16, 185, 129, 0.1);
        }

        .option-btn.wrong {
            border-color: var(--r);
            background: rgba(239, 68, 68, 0.08);
        }

        .option-btn.locked {
            cursor: default;
        }

        .option-btn.locked:hover {
            border-color: #e5e7f0;
            background: #fff;
        }

        .option-btn.locked.correct:hover {
            border-color: var(--ok);
            background: rgba(16, 185, 129, 0.1);
        }

        .option-btn.locked.wrong:hover {
            border-color: var(--r);
            background: rgba(239, 68, 68, 0.08);
        }

        .option-letter {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef0f8;
            border-radius: 50%;
            font-weight: 800;
            color: var(--tm);
            flex-shrink: 0;
            transition: all .28s;
        }

        .option-btn.selected .option-letter {
            background: linear-gradient(135deg, var(--h), var(--h2));
            color: #fff;
        }

        .option-btn.correct .option-letter {
            background: var(--ok);
            color: #fff;
        }

        .option-btn.wrong .option-letter {
            background: var(--r);
            color: #fff;
        }

        .option-text {
            flex: 1;
            font-size: .98rem;
            color: #334155;
        }

        .feedback-box {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: .95em;
            line-height: 1.75;
            animation: fadeIn .4s ease;
        }

        .feedback-correct {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #065f46;
        }

        .feedback-wrong {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.28);
            color: #991b1b;
        }

        .feedback-box .fb-title {
            font-weight: 800;
            margin-bottom: 4px;
        }

        .feedback-box .fb-exp {
            margin-top: 6px;
            padding-top: 8px;
            border-top: 1px dashed rgba(100, 116, 139, 0.25);
            color: var(--tm);
        }

        .quiz-navigation {
            display: flex;
            justify-content: space-between;
            gap: 14px;
        }

        .btn-nav {
            flex: 1;
        }

        /* ===== 报告页通用 ===== */
        .section-title {
            font-size: 1.22em;
            color: var(--h);
            margin: 4px 0 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.18);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .student-name {
            font-size: 1.85em;
            color: var(--h);
            font-weight: 800;
            margin-bottom: 6px;
        }

        .student-grade {
            color: var(--tm);
            font-size: 1em;
        }

        .score-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin: 26px 0;
        }

        .ring-wrap {
            position: relative;
            width: 190px;
            height: 190px;
        }

        .ring-wrap canvas {
            width: 190px;
            height: 190px;
        }

        .ring-center {
            position: absolute;
            top: 0;
            left: 0;
            width: 190px;
            height: 190px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .ring-score {
            font-size: 2.6em;
            font-weight: 900;
            background: linear-gradient(135deg, var(--h), var(--h2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .ring-label {
            font-size: .78em;
            color: var(--tm);
            margin-top: 6px;
        }

        .grade-badge {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--h), var(--h2));
            border-radius: 52px;
            font-size: 1.7em;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 10px 28px rgba(102, 126, 234, 0.4);
        }

        .grade-label {
            text-align: center;
            color: var(--tm);
            margin-top: 10px;
            font-size: .95em;
        }

        .meta-strip {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .meta-chip {
            background: #fafbff;
            border: 1px solid rgba(102, 126, 234, 0.14);
            padding: 9px 18px;
            border-radius: 22px;
            font-size: .85em;
            color: var(--tm);
        }

        .meta-chip b {
            color: var(--h);
        }

        .chart-container {
            display: flex;
            justify-content: center;
            margin: 16px 0;
            overflow-x: auto;
        }

        .chart-container canvas {
            max-width: 100%;
            height: auto;
        }

        .dimension-result {
            background: #fafbff;
            border: 1px solid rgba(102, 126, 234, 0.1);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 14px;
            animation: fadeIn .5s ease;
        }

        .dimension-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .dimension-name {
            font-weight: 700;
            font-size: 1em;
            color: var(--t);
        }

        .dimension-percent {
            font-size: 1.35em;
            font-weight: 900;
            color: var(--h);
        }

        .dimension-bar {
            height: 10px;
            background: #eef0f8;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .dimension-bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 1.1s cubic-bezier(.4, 0, .2, 1);
        }

        .dimension-stats {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            font-size: .86em;
            color: var(--tm);
            margin-bottom: 8px;
        }

        .dimension-stats span b {
            color: var(--t);
        }

        .ability-level {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 18px;
            font-size: .8em;
            font-weight: 700;
            margin-left: 6px;
        }

        .level-strong {
            background: rgba(16, 185, 129, 0.14);
            color: #065f46;
        }

        .level-medium {
            background: rgba(245, 158, 11, 0.15);
            color: #92400e;
        }

        .level-weak {
            background: rgba(239, 68, 68, 0.12);
            color: #991b1b;
        }

        .kp-list {
            display: grid;
            gap: 12px;
        }

        .kp-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            border: 1px solid #eef0f8;
            border-radius: 14px;
            padding: 12px 16px;
        }

        .kp-rank {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--r), #f97316);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: .85em;
            flex-shrink: 0;
        }

        .kp-name {
            flex: 1;
            font-weight: 600;
        }

        .kp-count {
            color: var(--tm);
            font-size: .85em;
        }

        .kp-bar {
            width: 70px;
            height: 8px;
            background: #eef0f8;
            border-radius: 6px;
            overflow: hidden;
        }

        .kp-bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #f97316);
            border-radius: 6px;
        }

        .wrong-question-item {
            background: rgba(239, 68, 68, 0.05);
            border-left: 4px solid var(--r);
            padding: 16px 18px;
            margin-bottom: 14px;
            border-radius: 0 14px 14px 0;
        }

        .wq-head {
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .wq-tag {
            font-size: .75em;
            background: rgba(239, 68, 68, 0.12);
            color: #c2410c;
            padding: 2px 10px;
            border-radius: 12px;
        }

        .wrong-answer {
            color: #dc2626;
            margin: 4px 0;
            font-size: .92em;
        }

        .correct-answer {
            color: #059669;
            margin: 4px 0;
            font-size: .92em;
        }

        .explanation {
            color: var(--tm);
            font-size: .9em;
            margin-top: 10px;
            line-height: 1.8;
            background: rgba(255, 255, 255, 0.6);
            padding: 10px 14px;
            border-radius: 10px;
        }

        .no-wrong {
            padding: 22px;
            text-align: center;
            color: var(--ok);
            background: rgba(16, 185, 129, 0.07);
            border-radius: 16px;
            font-weight: 600;
        }

        .summary-box {
            background: #fafbff;
            border: 1px solid rgba(102, 126, 234, 0.12);
            border-radius: 16px;
            padding: 20px;
            line-height: 1.9;
        }

        .highlight-item {
            display: inline-block;
            background: rgba(102, 126, 234, 0.12);
            color: var(--h);
            padding: 4px 14px;
            border-radius: 16px;
            margin: 4px;
            font-size: .85em;
            font-weight: 600;
        }

        .plan-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.09), rgba(118, 75, 162, 0.09));
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 14px;
        }

        .plan-title {
            font-weight: 800;
            font-size: 1.05em;
            color: var(--h);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .plan-list {
            list-style: none;
            display: grid;
            gap: 10px;
        }

        .plan-list li {
            display: flex;
            gap: 12px;

<script>
        // ==================== 全局变量 ====================
        var currentQuestionIndex = 0;
        var userAnswers = [];
        var timerInterval = null;
        var remainingTime = 1800;
        var studentInfo = { name: '', grade: '', school: '', gender: '', subject: '' };
        var quizStartTime = 0;

        // 维度配置
        var dimensions = [
            { id: 'perception', name: '空间感知', short: '感知', icon: '📐', color: '#667eea', subjects: '三角形、多边形结构', description: '三角形与多边形的结构特征与边角关系感知' },
            { id: 'rotation', name: '心理旋转', short: '旋转', icon: '🔄', color: '#8b5cf6', subjects: '折叠、翻转、对称旋转', description: '图形的折叠、翻转与轴对称旋转对称变换' },
            { id: 'visualization', name: '空间可视化', short: '可视化', icon: '✂️', color: '#06b6d4', subjects: '全等对应、勾股图形、折叠展开', description: '全等对应、勾股图形与折叠展开的空间表象' },
            { id: 'reasoning', name: '空间推理', short: '推理', icon: '🧠', color: '#f59e0b', subjects: '全等判定、等腰性质、四边形判定', description: '全等判定与等腰、平行四边形性质推理' },
            { id: 'orientation', name: '空间定向', short: '定向', icon: '👁️', color: '#10b981', subjects: '轴对称方位、对角线定向', description: '轴对称对应方位、折叠与对角线方向判断' },
            { id: 'imagination', name: '空间想象', short: '想象', icon: '🎯', color: '#ef4444', subjects: '拼接重组、折叠成盒、勾股应用', description: '图形拼接重组、折叠成盒与勾股定理综合想象' }
        ];

        // ==================== 题目数据（60题） ====================
        var questions = [
            // ===== 空间感知 perception（10题） =====
            { dimension: 'perception', question: '已知三角形的两边长分别为3和5，则第三边长x的取值范围是（　）。', svg: 'triangle_sides', options: ['A. 2＜x＜8','B. 2≤x≤8','C. 3＜x＜5','D. 1＜x＜7'], answer: 0, difficulty: 1, tag: '三角形三边关系', explanation: '三角形两边之和大于第三边、两边之差小于第三边：5-3＜x＜5+3，即2＜x＜8，故选A。' },
            { dimension: 'perception', question: '下列图形结构中，最稳定、不易变形的是（　）。', svg: 'triangle_stable', options: ['A. 四边形框架','B. 五边形框架','C. 三角形框架','D. 平行四边形框架'], answer: 2, difficulty: 1, tag: '三角形稳定性', explanation: '三角形具有稳定性：三边确定后形状唯一确定，不易变形；四边形等容易变形，故选C。' },
            { dimension: 'perception', question: '一个三角形的两个内角分别为70°和50°，则第三个内角为（　）。', svg: 'triangle_angles', options: ['A. 50°','B. 60°','C. 70°','D. 80°'], answer: 1, difficulty: 1, tag: '三角形内角和', explanation: '三角形内角和为180°，第三个内角=180°-70°-50°=60°，故选B。' },
            { dimension: 'perception', question: '三角形的三条中线相交于一点，这个交点叫做三角形的（　）。', svg: 'triangle_median', options: ['A. 重心','B. 内心','C. 外心','D. 垂心'], answer: 0, difficulty: 2, tag: '三角形的中线', explanation: '三角形的三条中线交于一点，这个交点叫做三角形的重心，故选A。' },
            { dimension: 'perception', question: '三角形的一个外角等于（　）。', svg: 'triangle_exterior', options: ['A. 与它不相邻的两个内角之和','B. 与它相邻的内角','C. 90°','D. 两个内角之差'], answer: 0, difficulty: 2, tag: '三角形的外角', explanation: '三角形外角性质：一个外角等于与它不相邻的两个内角之和，故选A。' },
            { dimension: 'perception', question: '八边形的内角和等于（　）。', svg: 'octagon', options: ['A. 720°','B. 900°','C. 1080°','D. 1440°'], answer: 2, difficulty: 2, tag: '多边形内角和', explanation: 'n边形内角和=(n-2)×180°，八边形=(8-2)×180°=1080°，故选C。' },
            { dimension: 'perception', question: '钝角三角形的高（　）。', svg: 'triangle_altitude', options: ['A. 都在三角形内部','B. 有三条在外部','C. 有一条在三角形外部','D. 没有高'], answer: 2, difficulty: 2, tag: '三角形的高', explanation: '钝角三角形中，从两个锐角顶点所作的高在三角形外部，只有一条高在内部，故选C。' },
            { dimension: 'perception', question: '下列长度的三条线段，能组成三角形的是（　）。', svg: 'triangle_three_sides', options: ['A. 1、2、3','B. 2、3、6','C. 4、5、9','D. 5、6、7'], answer: 3, difficulty: 3, tag: '三角形三边关系', explanation: 'A中1+2=3不满足大于关系，B中2+3＜6，C中4+5=9，均不能组成三角形；D中5+6=11＞7，能组成三角形，故选D。' },
            { dimension: 'perception', question: '在△ABC中，∠A=80°，BD、CD分别是∠ABC、∠ACB的平分线，则∠BDC=（　）。', svg: 'angle_bisector', options: ['A. 100°','B. 120°','C. 130°','D. 140°'], answer: 2, difficulty: 3, tag: '角平分线', explanation: '∠B+∠C=180°-80°=100°，则∠DBC+∠DCB=(∠B+∠C)/2=50°，故∠BDC=180°-50°=130°，故选C。' },
            { dimension: 'perception', question: '一个多边形的每个外角都是60°，则这个多边形是（　）边形。', svg: 'hexagon', options: ['A. 五','B. 六','C. 七','D. 八'], answer: 1, difficulty: 3, tag: '多边形外角和', explanation: '多边形的外角和恒为360°，360°÷60°=6，即正六边形，故选B。' },
            // ===== 心理旋转 rotation（10题） =====
            { dimension: 'rotation', question: '将一张正方形纸片沿一条对角线折叠，折痕两侧的部分（　）。', svg: 'fold_square', options: ['A. 完全重合','B. 部分重合','C. 不能重合','D. 无法确定'], answer: 0, difficulty: 1, tag: '折叠对称', explanation: '正方形的对角线是对称轴，沿对角线折叠后两侧完全重合，故选A。' },
            { dimension: 'rotation', question: '等腰三角形的对称轴是（　）。', svg: 'isosceles_axis', options: ['A. 底边上的中线所在的直线','B. 一条腰','C. 底边所在的直线','D. 顶角的两边'], answer: 0, difficulty: 1, tag: '轴对称', explanation: '等腰三角形是轴对称图形，对称轴是顶角平分线（即底边上的高、中线）所在的直线，故选A。' },
            { dimension: 'rotation', question: '在字母A、B、C、D、E中，是轴对称图形的字母共有（　）个。', svg: 'letters_axis', options: ['A. 2个','B. 3个','C. 4个','D. 5个'], answer: 3, difficulty: 1, tag: '轴对称图形', explanation: 'A沿竖直方向对称，B、C、D、E沿水平方向对称，5个字母都是轴对称图形，故选D。' },
            { dimension: 'rotation', question: '等边三角形绕它的中心旋转，至少旋转多少度后能与原图形重合？', svg: 'eq_tri_rotate_sym', options: ['A. 30°','B. 60°','C. 90°','D. 120°'], answer: 3, difficulty: 2, tag: '旋转对称', explanation: '等边三角形有三条对称轴，绕中心旋转120°、240°时三个顶点依次互换，图形与自身重合，最小为120°，故选D。' },
            { dimension: 'rotation', question: '把字母“b”竖直放在平面镜前，从镜中看到的是（　）。', svg: 'mirror_b', options: ['A. b','B. d','C. p','D. q'], answer: 1, difficulty: 2, tag: '镜面对称', explanation: '平面镜成像左右互换：字母b左右翻转后变为d，故选B。' },
            { dimension: 'rotation', question: '将一张正方形纸片对折两次后，沿折痕处剪一个小三角形，展开后纸片上有（　）个小三角形孔。', svg: 'fold_cut', options: ['A. 2个','B. 4个','C. 6个','D. 8个'], answer: 1, difficulty: 2, tag: '折叠', explanation: '对折两次相当于纸片叠成4层，剪一刀会同时剪透4层，展开后形成4个对称的小孔，故选B。' },
            { dimension: 'rotation', question: '把△ABC沿射线BC方向平移得到△DEF，下列说法正确的是（　）。', svg: 'translate_triangle', options: ['A. 平移前后图形形状和大小都不变','B. 只改变形状','C. 只改变大小','D. 形状和大小都改变'], answer: 0, difficulty: 2, tag: '平移', explanation: '平移只改变图形的位置，不改变图形的形状和大小，平移前后的两个图形全等，故选A。' },
            { dimension: 'rotation', question: '将三角形纸片ABC沿∠A的平分线AD折叠，使AB与AC重合。若∠B=40°，则∠C=（　）。', svg: 'triangle_fold_bisect', options: ['A. 30°','B. 40°','C. 50°','D. 60°'], answer: 1, difficulty: 3, tag: '折叠对称', explanation: '折叠是轴对称变换，折叠后AB与AC重合，∠B与∠C为对应角，对应角相等，故∠C=∠B=40°，故选B。' },

        // ==================== 页面切换 ====================
        function goToPage(pageId) {
            var pages = document.querySelectorAll('.page');
            for (var i = 0; i < pages.length; i++) {
                pages[i].className = 'page';
            }
            document.getElementById(pageId).className = 'page active';
            window.scrollTo(0, 0);
        }

        function getDimById(id) {
            for (var i = 0; i < dimensions.length; i++) {
                if (dimensions[i].id === id) return dimensions[i];
            }
            return dimensions[0];
        }

        function initWelcome() {
            var html = '';
            for (var i = 0; i < dimensions.length; i++) {
                var d = dimensions[i];
                html += '<div class="dimension-item">';
                html += '<div class="dimension-icon">' + d.icon + '</div>';
                html += '<div class="dimension-name">' + d.name + '</div>';
                html += '<div class="dimension-desc">' + d.description + '</div>';
                html += '</div>';
            }
            document.getElementById('welcomeDimGrid').innerHTML = html;
        }

        // ==================== 答题流程 ====================
        function startQuiz() {
            var name = document.getElementById('studentName').value.trim();
            studentInfo = {
                name: name || '匿名学生',
                grade: document.getElementById('studentGrade').value || '',
                school: document.getElementById('schoolName').value.trim(),
                gender: document.getElementById('studentGender').value,
                subject: document.getElementById('studentSubject').value
            };

            userAnswers = new Array(questions.length);
            for (var i = 0; i < userAnswers.length; i++) userAnswers[i] = null;
            currentQuestionIndex = 0;
            remainingTime = 1800;
            quizStartTime = new Date().getTime();

            goToPage('testPage');
            renderQuestion();
            startTimer();
        }

        function renderQuestion() {
            var q = questions[currentQuestionIndex];
            var dim = getDimById(q.dimension);

            document.getElementById('currentQ').textContent = currentQuestionIndex + 1;
            document.getElementById('totalQ').textContent = questions.length;
            document.getElementById('totalQ2').textContent = questions.length;
            document.getElementById('progressFill').style.width = ((currentQuestionIndex + 1) / questions.length * 100) + '%';

            var answeredCount = 0;
            for (var i = 0; i < userAnswers.length; i++) {
                if (userAnswers[i] !== null) answeredCount++;
            }
            document.getElementById('answeredQ').textContent = answeredCount;

            document.getElementById('dimensionBadge').textContent = dim.icon + ' ' + dim.name;
            document.getElementById('questionNumber').textContent = '第 ' + (currentQuestionIndex + 1) + ' 题 · ' + dim.name;
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('questionSvg').innerHTML = generateSVG(q.svg);

            var optionsHtml = '';
            for (var idx = 0; idx < q.options.length; idx++) {
                optionsHtml += '<div class="option-btn" id="opt_' + idx + '" onclick="selectOption(' + idx + ')">' +
                    '<span class="option-letter">' + String.fromCharCode(65 + idx) + '</span>' +
                    '<span class="option-text">' + q.options[idx].substring(3) + '</span></div>';
            }
            document.getElementById('optionsGrid').innerHTML = optionsHtml;
            document.getElementById('feedbackBox').className = 'feedback-box hidden';
            document.getElementById('feedbackBox').innerHTML = '';

            // 若该题已作答，恢复锁定与反馈状态
            if (userAnswers[currentQuestionIndex] !== null) {
                lockQuestion(userAnswers[currentQuestionIndex], true);
            }

            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').textContent = currentQuestionIndex === questions.length - 1 ? '提交答卷 ✓' : '下一题 →';
        }

        function selectOption(idx) {
            if (userAnswers[currentQuestionIndex] !== null) return;
            userAnswers[currentQuestionIndex] = idx;
            lockQuestion(idx, false);
        }

        function lockQuestion(idx, isRestore) {
            var q = questions[currentQuestionIndex];
            var options = document.querySelectorAll('.option-btn');
            var correctIdx = q.answer;

            for (var i = 0; i < options.length; i++) {
                options[i].classList.add('locked');
                options[i].setAttribute('onclick', '');
                if (i === idx) {
                    options[i].classList.add('selected');
                    if (i === correctIdx) {
                        options[i].classList.add('correct');
                    } else {
                        options[i].classList.add('wrong');
                    }
                }
                if (i === correctIdx && idx !== correctIdx) {
                    options[i].classList.add('correct');
                }
            }

            // 显示即时反馈
            var fb = document.getElementById('feedbackBox');
            var isCorrect = idx === correctIdx;
            if (isCorrect) {
                fb.className = 'feedback-box feedback-correct';
                fb.innerHTML = '<div class="fb-title">✓ 回答正确</div><div class="fb-exp">💡 ' + q.explanation + '</div>';
            } else {
                fb.className = 'feedback-box feedback-wrong';
                fb.innerHTML = '<div class="fb-title">✗ 回答错误</div>' +
                    '<div>正确答案：' + q.options[correctIdx] + '</div>' +
                    '<div class="fb-exp">💡 ' + q.explanation + '</div>';
            }
            fb.style.display = 'block';

            // 更新已答数量
            var answeredCount = 0;
            for (var i = 0; i < userAnswers.length; i++) {
                if (userAnswers[i] !== null) answeredCount++;
            }
            document.getElementById('answeredQ').textContent = answeredCount;

            // 维度切换动效
            var badge = document.getElementById('dimensionBadge');
            badge.classList.remove('flash');
            void badge.offsetWidth;
            badge.classList.add('flash');
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) {
                alert('请先选择本题的答案');
                return;
            }
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                submitQuiz();
            }
        }

        // ==================== 计时 ====================
        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(function() {
                remainingTime--;
                updateTimerDisplay();
                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            var minutes = Math.floor(remainingTime / 60);
            var seconds = remainingTime % 60;
            document.getElementById('timeDisplay').textContent =
                (minutes < 10 ? '0' : '') + minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
        }

        function getElapsedText() {
            var sec = Math.round((new Date().getTime() - quizStartTime) / 1000);
            if (sec < 60) return sec + '秒';
            var m = Math.floor(sec / 60);
            var s = sec % 60;
            return m + '分' + (s < 10 ? '0' : '') + s + '秒';
        }

        // ==================== 评分与辅助 ====================
        function getGrade(p) {

            if (p >= 60) return { grade: 'B', color: '#5b9cf5', label: '空间能力良好', advice: '基础良好，针对薄弱知识点进行专项突破，稳步提升空间想象与几何推理能力' };
            if (p >= 40) return { grade: 'C', color: '#f59e0b', label: '空间能力待提升', advice: '建议系统训练，从三角形边角关系、全等与轴对称基础夯实，循序渐进提升空间思维' };

        }

        function getLevel(p) {
            if (p >= 80) return { level: '强', cls: 'level-strong' };
            if (p >= 50) return { level: '中', cls: 'level-medium' };
            return { level: '弱', cls: 'level-weak' };
        }

        function getLevelText(p) {
            if (p >= 80) return '表现出色，空间直觉敏锐，能够快速完成全等、折叠与勾股综合图形的想象任务。';
            if (p >= 50) return '基础较为扎实，但面对全等判定、四边形性质与勾股定理综合题时仍有一定提升空间。';
            return '较为薄弱，需要加强三角形结构识别与轴对称、折叠图形训练，打好初中几何基础。';
        }

        function calculateAllScores() {
            var dimScores = {};
            var dimMax = {};
            var dimCorrect = {};
            for (var i = 0; i < dimensions.length; i++) {
                dimScores[dimensions[i].id] = 0;
                dimMax[dimensions[i].id] = 0;
                dimCorrect[dimensions[i].id] = 0;
            }
            var totalScore = 0;
            var totalMax = 0;
            var totalCorrect = 0;

            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                dimMax[q.dimension] += q.difficulty;
                totalMax += q.difficulty;
                if (userAnswers[i] !== null && userAnswers[i] === q.answer) {
                    dimScores[q.dimension] += q.difficulty;
                    dimCorrect[q.dimension]++;
                    totalScore += q.difficulty;
                    totalCorrect++;
                }
            }

            var dims = {};
            for (var i = 0; i < dimensions.length; i++) {
                var d = dimensions[i];
                var max = dimMax[d.id];
                dims[d.id] = {
                    name: d.name,
                    short: d.short,
                    icon: d.icon,
                    color: d.color,
                    subjects: d.subjects,
                    score: dimScores[d.id],
                    maxScore: max,
                    correct: dimCorrect[d.id],
                    total: 10,
                    percentage: max > 0 ? Math.round(dimScores[d.id] / max * 100) : 0
                };
            }

            return {
                dimensions: dims,
                totalScore: totalScore,
                totalMaxScore: totalMax,
                overallPercentage: totalMax > 0 ? Math.round(totalScore / totalMax * 100) : 0,
                totalCorrect: totalCorrect,
                totalQuestions: questions.length
            };
        }

        // ==================== 图表绘制 ====================
        function drawRing(canvasEl, pct, color) {
            var c = canvasEl;
            var ctx = c.getContext('2d');
            var size = 190, cx = size / 2, cy = size / 2, r = 78;
            c.width = size;
            c.height = size;
            ctx.clearRect(0, 0, size, size);
            ctx.lineWidth = 16;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(100,116,139,.12)';
            ctx.stroke();
            var start = -Math.PI / 2;
            var end = start + Math.PI * 2 * pct / 100;
            var grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#667eea');
            grad.addColorStop(1, '#764ba2');
            ctx.strokeStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, r, start, end);
            ctx.stroke();
        }

        function drawRadar(canvasEl, scores) {
            var c = canvasEl;
            var ctx = c.getContext('2d');
            var size = 340, cx = size / 2, cy = size / 2, r = 118, n = 6;
            c.width = size;
            c.height = size;
            var keys = [];
            var labels = [];
            var colors = [];
            for (var id in scores.dimensions) {
                keys.push(id);
                labels.push(scores.dimensions[id].short);
                colors.push(scores.dimensions[id].color);
            }
            var step = Math.PI * 2 / n;
            ctx.strokeStyle = 'rgba(100,116,139,.16)';
            ctx.lineWidth = 1;
            for (var l = 1; l <= 5; l++) {
                ctx.beginPath();
                var rr = r * l / 5;
                for (var i = 0; i <= n; i++) {
                    var a = step * i - Math.PI / 2;
                    var x = cx + rr * Math.cos(a);
                    var y = cy + rr * Math.sin(a);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            }
            for (var i = 0; i < n; i++) {
                var a = step * i - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
                ctx.stroke();
            }
            var pts = [];
            ctx.beginPath();
            for (var i = 0; i < n; i++) {
                var pct = scores.dimensions[keys[i]].percentage;
                var rr = r * pct / 100;
                var a = step * i - Math.PI / 2;
                var x = cx + rr * Math.cos(a);
                var y = cy + rr * Math.sin(a);
                pts.push({ x: x, y: y });
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            var grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, 'rgba(102,126,234,.4)');
            grad.addColorStop(1, 'rgba(118,75,162,.3)');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            for (var i = 0; i < pts.length; i++) {
                ctx.beginPath();
                ctx.arc(pts[i].x, pts[i].y, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#667eea';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            for (var i = 0; i < n; i++) {
                var a = step * i - Math.PI / 2;
                var x = cx + (r + 26) * Math.cos(a);
                var y = cy + (r + 26) * Math.sin(a);
                ctx.fillStyle = '#334155';
                ctx.fillText(labels[i], x, y);
                ctx.fillStyle = colors[i];
                ctx.fillText(scores.dimensions[keys[i]].percentage + '%', x, y + 17);
            }
            return c;
        }

        function drawBar(canvasEl, scores) {
            var c = canvasEl;
            var ctx = c.getContext('2d');
            var w = 460, h = 230;
            c.width = w;
            c.height = h;
            var keys = [];
            var labels = [];
            var colors = [];
            for (var id in scores.dimensions) {
                keys.push(id);
                labels.push(scores.dimensions[id].short);
                colors.push(scores.dimensions[id].color);
            }
            var bw = 46, gap = 26, sx = 40, sy = h - 40, maxH = 130;
            ctx.font = 'bold 12px sans-serif';
            for (var i = 0; i < keys.length; i++) {
                var pct = scores.dimensions[keys[i]].percentage;
                var bh = maxH * pct / 100;
                var x = sx + i * (bw + gap);
                var grad = ctx.createLinearGradient(0, sy - bh, 0, sy);
                grad.addColorStop(0, colors[i]);
                grad.addColorStop(1, colors[i] + '88');
                ctx.fillStyle = grad;
                ctx.fillRect(x, sy - bh, bw, bh);
                ctx.fillStyle = '#334155';
                ctx.textAlign = 'center';
                ctx.fillText(pct + '%', x + bw / 2, sy - bh - 8);
                ctx.fillStyle = '#64748b';
                ctx.font = '11px sans-serif';
                ctx.fillText(labels[i], x + bw / 2, sy + 18);
                ctx.font = 'bold 12px sans-serif';
            }
            ctx.strokeStyle = 'rgba(100,116,139,.15)';
            ctx.beginPath();
            ctx.moveTo(sx - 5, sy);
            ctx.lineTo(w - 10, sy);
            ctx.stroke();
            return c;
        }

        // ==================== 提交与结果 ====================
        function submitQuiz() {
            var s = calculateAllScores();

        function showResults(scores) {
            if (timerInterval) clearInterval(timerInterval);

        function getWrongList() {
            var wrongs = [];
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                if (userAnswers[i] !== null && userAnswers[i] !== q.answer) {
                    var dim = getDimById(q.dimension);
                    wrongs.push({ qi: i, q: q, ua: userAnswers[i], dimName: dim.name, short: dim.short, color: dim.color });
                }
            }
            return wrongs;
        }

        function buildKpCluster(wrongs) {
            var map = {};
            for (var i = 0; i < wrongs.length; i++) {
                var tag = wrongs[i].q.tag;
                if (!map[tag]) map[tag] = { tag: tag, count: 0, names: [] };
                map[tag].count++;
                if (map[tag].names.indexOf(wrongs[i].short) < 0) map[tag].names.push(wrongs[i].short);
            }
            var arr = [];
            for (var t in map) arr.push(map[t]);
            arr.sort(function (a, b) { return b.count - a.count; });
            return arr;
        }

        function getSubjectAdvice(scores) {
            var s = [], d = [];
            for (var id in scores.dimensions) {
                var dim = scores.dimensions[id];
                if (dim.percentage >= 80) s.push(dim.name);
                if (dim.percentage < 55) d.push(dim.name);
            }
            return { s: s, d: d };
        }

                    html += '<span class="kp-name">' + k.tag + '</span>';
                    html += '<span class="kp-count">错' + k.count + '题</span>';
                    html += '<div class="kp-bar"><i style="width:' + Math.round(k.count / maxCount * 100) + '%"></i></div></div>';
                }
                html += '</div>';
            }
            html += '</div>';

            // 错题回顾
            html += '<div class="card"><h3 class="section-title">📖 错题回顾与解析</h3>';
            if (wrongs.length === 0) {
                html += '<div class="no-wrong">全部答对，非常优秀！继续保持高水平空间思维。</div>';
            } else {
                for (var i = 0; i < wrongs.length; i++) {
                    var w = wrongs[i];
                    html += '<div class="wrong-question-item">';
                    html += '<div class="wq-head">第' + (w.qi + 1) + '题 <span class="wq-tag">' + w.q.tag + '</span><span style="color:var(--tm);font-weight:400;font-size:.82em">· ' + w.dimName + '</span></div>';
                    html += '<div style="font-size:.92em;margin-bottom:8px">' + w.q.question + '</div>';
                    if (w.q.svg) html += '<div style="display:flex;justify-content:center;margin:10px 0">' + generateSVG(w.q.svg) + '</div>';
                    html += '<div class="wrong-answer">✗ 你的答案：' + (w.q.options[w.ua] || '未作答') + '</div>';
                    html += '<div class="correct-answer">✓ 正确答案：' + w.q.options[w.q.answer] + '</div>';
                    html += '<div class="explanation">💡 ' + w.q.explanation + '</div>';
                    html += '</div>';
                }
            }
            html += '</div>';

            // 综合解读
            html += '<div class="card"><h3 class="section-title">💬 综合解读</h3>';
            html += '<div class="summary-box">';
            var strong = null, weak = null;
            for (var i = 0; i < keys.length; i++) {
                var dim = scores.dimensions[keys[i]];
                if (!strong || dim.percentage > strong.percentage) strong = dim;
                if (!weak || dim.percentage < weak.percentage) weak = dim;
            }
            html += '<p><b>' + info.name + '</b> 本次测评综合得分 <b>' + scores.overallPercentage + '%</b>，达到 <b>' + g.grade + '级 · ' + g.label + '</b>。';
            html += '最强维度是 <b>' + strong.short + '</b>（' + strong.percentage + '%），最需提升的是 <b>' + weak.short + '</b>（' + weak.percentage + '%）。</p>';
            html += '<p style="margin-top:8px">' + g.advice + '。</p>';
            html += '<div style="margin-top:12px">';
            var sa = getSubjectAdvice(scores);
            if (sa.s.length) html += '<span class="highlight-item">优势可迁移：' + sa.s.join('、') + '</span>';
            if (sa.d.length) html += '<span class="highlight-item">重点提升：' + sa.d.join('、') + '</span>';
            html += '</div></div></div>';

            // 周训练计划
            html += '<div class="card"><h3 class="section-title">🗓️ 个性化周训练计划</h3>';
            var weakTags = kp.length ? kp.slice(0, 2) : [];
            var planTags = [];
            for (var i = 0; i < weakTags.length; i++) planTags.push(weakTags[i].tag);
            if (planTags.length === 0) planTags.push('空间综合训练');
            var plans = getWeekPlan(g.grade, weak, planTags);
            for (var i = 0; i < plans.length; i++) {
                html += '<div class="plan-card"><div class="plan-title">' + plans[i].t + '</div><ul class="plan-list">';
                for (var j = 0; j < plans[i].items.length; j++) {
                    html += '<li><b>' + (j + 1) + '</b><span>' + plans[i].items[j] + '</span></li>';
                }
                html += '</ul></div>';
            }
            html += '</div>';

            // 学科关联与中考升学建议
            html += '<div class="card"><h3 class="section-title">📚 学科关联与中考升学建议</h3><div class="subject-grid">';
            var subs = [
                { n: '📐 数学', d: '初中几何（三角形、全等、轴对称、勾股、四边形）是空间思维的主战场。' + strong.short + '优秀可直接迁移到几何综合题与中考压轴题。' },
                { n: '⚡ 物理', d: '初二物理中的受力分析、光的反射、平面镜成像等都需要空间想象能力，尤其' + weak.short + '不足时建议加强训练。' },
                { n: '🧭 地理', d: '等高线地形图、方向判断、地图阅读等都依赖空间定向与想象能力，也是中考地理解题的重要基础。' },
                { n: '🎨 通用技术', d: '图形观察、机械制图、工程图纸是空间可视化能力的直接应用，也是后续理工科学习的重要基础。' }
            ];
            for (var i = 0; i < subs.length; i++) {
                html += '<div class="subject-card"><div class="subject-name">' + subs[i].n + '</div><div class="subject-desc">' + subs[i].d + '</div></div>';
            }
            html += '</div>';
            var selAdvice = '';
            if (scores.overallPercentage >= 75) selAdvice = '空间能力优秀，对初二几何（全等、轴对称、勾股定理、平行四边形）掌握良好，初中几何板块扎实，利于中考数学几何部分与后续高中几何学习，可向示范性高中及理科方向努力。';
            else if (scores.overallPercentage >= 55) selAdvice = '空间能力中等，初中几何基础较为扎实，建议加强全等判定与四边形综合训练，稳步提升几何得分率，为中考数学高分与高中学习衔接打好基础。';
            else selAdvice = '空间能力相对薄弱，建议从三角形三边关系、内角和等基础知识夯实开始，循序渐进提升几何理解，配合系统训练逐步扫清中考几何薄弱点。';
            html += '<div class="plan-card" style="margin-top:16px"><div class="plan-title">🎓 中考升学规划建议</div><p style="font-size:.93em;line-height:1.9;color:var(--t)">' + selAdvice + '</p></div>';
            html += '</div>';

            // 家长寄语
            html += '<div class="card"><h3 class="section-title">💝 家长寄语</h3><div class="parent-card">';
            html += '<div class="parent-title">给家长的一封信</div>';
            var pMsg = '';
            if (scores.overallPercentage >= 75) {
                pMsg = '恭喜您！孩子在初二阶段的空间思维方面表现出较强的天赋和潜力，对初中几何（全等、轴对称、勾股定理、平行四边形）掌握扎实，这对中考数学及后续高中几何学习是巨大的优势。建议在保持优势的同时，鼓励孩子挑战中考几何压轴题与折叠、拼接探究题，引导他将这种能力迁移到物理、地理等学科中。同时注意劳逸结合，帮助孩子在初中阶段保持良好的心态与节奏，稳步向目标高中迈进。';
            } else if (scores.overallPercentage >= 55) {
                pMsg = '孩子的空间思维能力处于中等水平，仍有很大提升空间。空间思维是可以通过科学训练显著提升的能力，建议每天安排15-20分钟的空间图形练习，多做折纸、拼搭、观察几何图形等活动。初二正是全等与四边形学习的关键期，请多给予孩子耐心与鼓励，合理安排训练与复习时间，进步往往就在坚持之中。';
            } else {
                pMsg = '孩子的空间思维能力目前相对薄弱，这并不代表孩子不聪明，而是说明这一能力需要更多针对性训练。初中几何是中考数学的重要组成部分，建议降低训练难度、以兴趣培养为先，用折纸、积木、拼图等实物激发空间想象。同时建议您联系我们，安排一次专业的空间思维1对1诊断与辅导，帮助孩子尽快找到提升路径。请多给孩子鼓励与陪伴，尊重他的成长节奏，学业路上家长的理解就是孩子最大的底气。';
            }
            html += '<p class="parent-text">' + pMsg + '</p></div></div>';

            // 教师咨询卡
            html += '<div class="card no-print"><h3 class="section-title">👨‍🏫 专业成长支持</h3><div class="teacher-card">';
            html += '<div class="teacher-avatar">👨‍🏫</div><div class="teacher-info">';
            html += '<div class="teacher-name">刘老师 · 资深理科教育规划师</div>';
            html += '<div class="teacher-award">★ 央视受邀专访嘉宾</div>';
            html += '<div class="teacher-stats">从业8年 · 学员3100+ · 专注空间思维与理科培优</div>';
            html += '<div class="teacher-phone">📞 17875314336（测评后可预约一对一咨询）</div>';
            html += '</div></div></div>';

            // 打印按钮
            html += '<div class="print-bar no-print">';
            html += '<button class="btn btn-secondary" onclick="restart()">重新测评</button>';
            html += '<button class="btn" onclick="window.print()">🖨️ 打印报告</button>';
            html += '</div>';
            html += '<div class="footer-sign no-print">系统设计制作：刘岳</div>';

            document.getElementById('reportContent').innerHTML = html;

            setTimeout(function () {
                var ring = document.getElementById('ringCanvas');
                if (ring) drawRing(ring, scores.overallPercentage, g.color);
                var rb = document.getElementById('radarBox');
                if (rb) rb.appendChild(drawRadar(document.createElement('canvas'), scores));
                var bb = document.getElementById('barBox');
                if (bb) bb.appendChild(drawBar(document.createElement('canvas'), scores));
            }, 120);
        }

        function doLogin() {
            var u = document.getElementById('loginUser').value.trim();
            var p = document.getElementById('loginPass').value.trim();
            var err = document.getElementById('loginError');
            if (u === '' || p === '') {
                err.textContent = '请输入账号和密码';
                return;
            }
            if (u === LOGIN_USER && p === LOGIN_PASS) {
                sessionStorage.setItem('sys_login_ok', '1');
                document.getElementById('loginOverlay').style.display = 'none';
                initWelcome();
            } else {
                err.textContent = '账号或密码错误，请重新输入';
                document.getElementById('loginPass').value = '';
            }
        }

        function checkLogin() {
            var ok = sessionStorage.getItem('sys_login_ok');
            if (ok === '1') {
                document.getElementById('loginOverlay').style.display = 'none';
                initWelcome();
            }
        }

        // 回车键提交登录

                if (overlay && overlay.style.display !== 'none') {
                    doLogin();
                }
            }
        });
