<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初一空间思维检测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --p: #ffffff;
            --s: #f6f8ff;
            --a: #eef1ff;
            --h: #667eea;
            --h2: #764ba2;
            --t: #1e293b;
            --tm: #64748b;
            --ok: #10b981;
            --w: #f59e0b;
            --r: #ef4444;
            --gl: #a8c0ff;
            --gp: #c4b5fd;
            --grad: linear-gradient(135deg, #667eea 0%, #764ba2 55%, #f093fb 100%);
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--grad);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--t);
            overflow-x: hidden;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn .5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glowPulse {
            0%, 100% { opacity: .35; transform: scale(1); }
            50% { opacity: .6; transform: scale(1.15); }
        }

        @keyframes dimFlash {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(102,126,234,.6); }
            50% { transform: scale(1.06); box-shadow: 0 0 0 12px rgba(102,126,234,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(102,126,234,0); }
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            box-shadow: 0 18px 40px -14px rgba(0, 0, 0, 0.22);
            padding: 34px;
            margin-bottom: 18px;
            backdrop-filter: blur(8px);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 30px;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .3s ease;
            color: #fff;
            background: linear-gradient(135deg, var(--h), var(--h2));
            box-shadow: 0 10px 22px rgba(102, 126, 234, 0.35);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(102, 126, 234, 0.45);
        }

        .btn-secondary {
            background: rgba(100, 116, 139, 0.12);
            color: var(--tm);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(100, 116, 139, 0.2);
            color: var(--t);
        }

        .footer-sign {
            text-align: center;
            margin-top: 22px;
            color: rgba(255, 255, 255, 0.85);
            font-size: .88rem;
            letter-spacing: 1px;
        }

        /* ===== 登录页 ===== */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--grad);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity .4s;
        }

        .login-box {
            background: #fff;
            border-radius: 20px;
            padding: 40px 34px 30px;
            width: 320px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn .6s ease;
        }

        .login-logo svg {
            width: 86px;
            height: 86px;
            margin-bottom: 6px;
            animation: float 3s ease-in-out infinite;
        }

        .login-box h2 {
            margin: 0 0 6px;
            font-size: 22px;
            color: var(--t);
            font-weight: 800;
        }

        .login-sub {
            font-size: 12px;
            color: var(--tm);
            margin-bottom: 20px;
        }

        .login-input {
            width: 100%;
            padding: 13px 16px;
            margin: 8px 0;
            border: 1.8px solid #e5e7f0;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color .3s, box-shadow .3s;
        }

        .login-input:focus {
            border-color: var(--h);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            margin: 14px 0 8px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--h), var(--h2));
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity .3s, transform .2s;
        }

        .login-btn:hover {
            opacity: .9;
            transform: translateY(-1px);
        }

        .login-error {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            min-height: 18px;
        }

        .login-credits {
            text-align: center;
            margin-top: 14px;
            font-size: 12px;
            color: #aaa;
        }

        /* ===== 欢迎页 ===== */
        .welcome-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .welcome-icon {
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
            animation: float 3s ease-in-out infinite;
        }

        .welcome-title {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--h), var(--h2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .welcome-subtitle {
            font-size: 1.02rem;
            color: var(--tm);
            line-height: 2;
            text-align: center;
        }

        .dimension-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 26px 0;
        }

        .dimension-item {
            background: linear-gradient(135deg, #f5f7fa, #eef1ff);
            border: 1px solid rgba(102, 126, 234, 0.12);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            transition: all .3s ease;
        }

        .dimension-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.16);
        }

        .dimension-icon {
            font-size: 2rem;
            margin-bottom: 6px;
        }

        .dimension-name {
            font-weight: 700;
            color: var(--t);
            font-size: .92rem;
        }

        .dimension-desc {
            font-size: .74rem;
            color: var(--tm);
            margin-top: 4px;
            line-height: 1.6;
        }

        .welcome-footer {
            text-align: center;
            margin-top: 18px;
            color: var(--tm);
            font-size: .85rem;
        }

        /* ===== 信息页 ===== */
        .main-title {
            text-align: center;
            font-size: 1.7em;
            color: var(--t);
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--tm);
            font-size: 1em;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--tm);
            font-weight: 600;
            font-size: .92em;
        }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            background: #fafbff;
            border: 2px solid #e5e7f0;
            border-radius: 12px;
            color: var(--t);
            font-size: 1em;
            outline: none;
            transition: border-color .3s, box-shadow .3s;
        }

        .form-input:focus {
            border-color: var(--h);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-select {
            width: 100%;
            padding: 13px 16px;
            background: #fafbff;
            border: 2px solid #e5e7f0;
            border-radius: 12px;
            color: var(--t);
            font-size: 1em;
            cursor: pointer;
            outline: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 10px;
        }

        /* ===== 答题页 ===== */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .quiz-progress {
            flex: 1;
            min-width: 180px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: .88em;
            color: var(--tm);
        }

        .progress-text b {
            color: var(--h);
        }

        .progress-bar {
            height: 10px;
            background: #eef0f8;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--h), var(--h2));
            border-radius: 6px;
            transition: width .7s cubic-bezier(.4, 0, .2, 1);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 22px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 6px;
        }

        .quiz-timer {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            color: #92400e;
            font-size: .95em;
            white-space: nowrap;
        }

        .dimension-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--h), var(--h2));
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: .9rem;
            font-weight: 700;
            margin-bottom: 16px;
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.3);
        }

        .dimension-badge.flash {
            animation: dimFlash .7s ease;
        }

        .question-card {
            background: #f8fafc;
            border: 1px solid #eef0f8;
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 18px;
        }

        .question-number {
            display: inline-block;
            background: linear-gradient(135deg, var(--h), var(--h2));
            color: #fff;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: .85rem;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .question-text {
            font-size: 1.12rem;
            color: var(--t);
            line-height: 1.75;
            margin-bottom: 18px;
        }

        .question-svg {
            display: flex;
            justify-content: center;
            margin: 14px 0;
        }

        .question-svg svg {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.08));
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: #fff;
            border: 2px solid #e5e7f0;
            border-radius: 14px;
            cursor: pointer;
            transition: all .3s ease;
            text-align: left;
        }

        .option-btn:hover {
            border-color: var(--h);
            background: #f0f4ff;
        }

        .option-btn.selected {
            border-color: var(--h);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.12), rgba(118, 75, 162, 0.12));
        }

        .option-btn.correct {
            border-color: var(--ok);
            background: rgba(16, 185, 129, 0.1);
        }

        .option-btn.wrong {
            border-color: var(--r);
            background: rgba(239, 68, 68, 0.08);
        }

        .option-btn.locked {
            cursor: default;
        }

        .option-btn.locked:hover {
            border-color: #e5e7f0;
            background: #fff;
        }

        .option-btn.locked.correct:hover {
            border-color: var(--ok);
            background: rgba(16, 185, 129, 0.1);
        }

        .option-btn.locked.wrong:hover {
            border-color: var(--r);
            background: rgba(239, 68, 68, 0.08);
        }

        .option-letter {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef0f8;
            border-radius: 50%;
            font-weight: 800;
            color: var(--tm);
            flex-shrink: 0;
            transition: all .28s;
        }

        .option-btn.selected .option-letter {
            background: linear-gradient(135deg, var(--h), var(--h2));
            color: #fff;
        }

        .option-btn.correct .option-letter {
            background: var(--ok);
            color: #fff;
        }

        .option-btn.wrong .option-letter {
            background: var(--r);
            color: #fff;
        }

        .option-text {
            flex: 1;
            font-size: .98rem;
            color: #334155;
        }

        .feedback-box {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: .95em;
            line-height: 1.75;
            animation: fadeIn .4s ease;
        }

        .feedback-correct {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #065f46;
        }

        .feedback-wrong {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.28);
            color: #991b1b;
        }

        .feedback-box .fb-title {
            font-weight: 800;
            margin-bottom: 4px;
        }

        .feedback-box .fb-exp {
            margin-top: 6px;
            padding-top: 8px;
            border-top: 1px dashed rgba(100, 116, 139, 0.25);
            color: var(--tm);
        }

        .quiz-navigation {
            display: flex;
            justify-content: space-between;
            gap: 14px;
        }

        .btn-nav {
            flex: 1;
        }

        /* ===== 报告页通用 ===== */
        .section-title {
            font-size: 1.22em;
            color: var(--h);
            margin: 4px 0 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.18);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .student-name {
            font-size: 1.85em;
            color: var(--h);
            font-weight: 800;
            margin-bottom: 6px;
        }

        .student-grade {
            color: var(--tm);
            font-size: 1em;
        }

        .score-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin: 26px 0;
        }

        .ring-wrap {
            position: relative;
            width: 190px;
            height: 190px;
        }

        .ring-wrap canvas {
            width: 190px;
            height: 190px;
        }

        .ring-center {
            position: absolute;
            top: 0;
            left: 0;
            width: 190px;
            height: 190px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .ring-score {
            font-size: 2.6em;
            font-weight: 900;
            background: linear-gradient(135deg, var(--h), var(--h2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .ring-label {
            font-size: .78em;
            color: var(--tm);
            margin-top: 6px;
        }

        .grade-badge {
            display: inline-block;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--h), var(--h2));
            border-radius: 52px;
            font-size: 1.7em;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 10px 28px rgba(102, 126, 234, 0.4);
        }

        .grade-label {
            text-align: center;
            color: var(--tm);
            margin-top: 10px;
            font-size: .95em;
        }

        .meta-strip {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .meta-chip {
            background: #fafbff;
            border: 1px solid rgba(102, 126, 234, 0.14);
            padding: 9px 18px;
            border-radius: 22px;
            font-size: .85em;
            color: var(--tm);
        }

        .meta-chip b {
            color: var(--h);
        }

        .chart-container {
            display: flex;
            justify-content: center;
            margin: 16px 0;
            overflow-x: auto;
        }

        .chart-container canvas {
            max-width: 100%;
            height: auto;
        }

        .dimension-result {
            background: #fafbff;
            border: 1px solid rgba(102, 126, 234, 0.1);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 14px;
            animation: fadeIn .5s ease;
        }

        .dimension-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .dimension-name {
            font-weight: 700;
            font-size: 1em;
            color: var(--t);
        }

        .dimension-percent {
            font-size: 1.35em;
            font-weight: 900;
            color: var(--h);
        }

        .dimension-bar {
            height: 10px;
            background: #eef0f8;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .dimension-bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 1.1s cubic-bezier(.4, 0, .2, 1);
        }

        .dimension-stats {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            font-size: .86em;
            color: var(--tm);
            margin-bottom: 8px;
        }

        .dimension-stats span b {
            color: var(--t);
        }

        .ability-level {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 18px;
            font-size: .8em;
            font-weight: 700;
            margin-left: 6px;
        }

        .level-strong {
            background: rgba(16, 185, 129, 0.14);
            color: #065f46;
        }

        .level-medium {
            background: rgba(245, 158, 11, 0.15);
            color: #92400e;
        }

        .level-weak {
            background: rgba(239, 68, 68, 0.12);
            color: #991b1b;
        }

        .kp-list {
            display: grid;
            gap: 12px;
        }

        .kp-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            border: 1px solid #eef0f8;
            border-radius: 14px;
            padding: 12px 16px;
        }

        .kp-rank {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--r), #f97316);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: .85em;
            flex-shrink: 0;
        }

        .kp-name {
            flex: 1;
            font-weight: 600;
        }

        .kp-count {
            color: var(--tm);
            font-size: .85em;
        }

        .kp-bar {
            width: 70px;
            height: 8px;
            background: #eef0f8;
            border-radius: 6px;
            overflow: hidden;
        }

        .kp-bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #f97316);
            border-radius: 6px;
        }

        .wrong-question-item {
            background: rgba(239, 68, 68, 0.05);
            border-left: 4px solid var(--r);
            padding: 16px 18px;
            margin-bottom: 14px;
            border-radius: 0 14px 14px 0;
        }

        .wq-head {
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .wq-tag {
            font-size: .75em;
            background: rgba(239, 68, 68, 0.12);
            color: #c2410c;
            padding: 2px 10px;
            border-radius: 12px;
        }

        .wrong-answer {
            color: #dc2626;
            margin: 4px 0;
            font-size: .92em;
        }

        .correct-answer {
            color: #059669;
            margin: 4px 0;
            font-size: .92em;
        }

        .explanation {
            color: var(--tm);
            font-size: .9em;
            margin-top: 10px;
            line-height: 1.8;
            background: rgba(255, 255, 255, 0.6);
            padding: 10px 14px;
            border-radius: 10px;
        }

        .no-wrong {
            padding: 22px;
            text-align: center;
            color: var(--ok);
            background: rgba(16, 185, 129, 0.07);
            border-radius: 16px;
            font-weight: 600;
        }

        .summary-box {
            background: #fafbff;
            border: 1px solid rgba(102, 126, 234, 0.12);
            border-radius: 16px;
            padding: 20px;
            line-height: 1.9;
        }

        .highlight-item {
            display: inline-block;
            background: rgba(102, 126, 234, 0.12);
            color: var(--h);
            padding: 4px 14px;
            border-radius: 16px;
            margin: 4px;
            font-size: .85em;
            font-weight: 600;
        }

        .plan-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.09), rgba(118, 75, 162, 0.09));
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 14px;
        }

        .plan-title {
            font-weight: 800;
            font-size: 1.05em;
            color: var(--h);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .plan-list {
            list-style: none;
            display: grid;
            gap: 10px;
        }

        .plan-list li {
            display: flex;
            gap: 12px;

    </style>
</head>

<script>
        // ==================== 全局变量 ====================
        var currentQuestionIndex = 0;
        var userAnswers = [];
        var timerInterval = null;
        var remainingTime = 1800;
        var studentInfo = { name: '', grade: '', school: '', gender: '', subject: '' };
        var quizStartTime = 0;

        // 维度配置
        var dimensions = [
            { id: 'perception', name: '空间感知', short: '感知', icon: '📐', color: '#667eea', subjects: '立体图形、点线面体', description: '立体图形与平面图形识别、点线面体感知' },
            { id: 'rotation', name: '心理旋转', short: '旋转', icon: '🔄', color: '#8b5cf6', subjects: '展开图折叠、旋转对称', description: '展开图折叠与旋转对称的心理变换' },
            { id: 'visualization', name: '空间可视化', short: '可视化', icon: '✂️', color: '#06b6d4', subjects: '从不同方向看、三视图、展开图', description: '从不同方向看物体与展开图转化' },
            { id: 'reasoning', name: '空间推理', short: '推理', icon: '🧠', color: '#f59e0b', subjects: '相交线、平行线、角', description: '相交线平行线判定性质与角的推理' },
            { id: 'orientation', name: '空间定向', short: '定向', icon: '👁️', color: '#10b981', subjects: '平面直角坐标系、坐标表示平移', description: '坐标系定位与坐标表示平移' },
            { id: 'imagination', name: '空间想象', short: '想象', icon: '🎯', color: '#ef4444', subjects: '展开折叠、平移、简单几何体', description: '展开图折叠、平移变换与几何体综合想象' }
        ];

        // ==================== 题目数据（60题） ====================
        var questions = [
            // ===== 空间感知 perception（10题） =====
            { dimension: 'perception', question: '下列图形中，属于立体图形的是（　）。', svg: 'solid_vs_plane', options: ['A. 圆','B. 三角形','C. 正方体','D. 正方形'], answer: 2, difficulty: 1, tag: '立体图形', explanation: '圆、三角形、正方形都只在一个平面内，是平面图形；正方体占据空间，是立体图形。故选C。' },
            { dimension: 'perception', question: '圆柱是由（　）个面围成的。', svg: 'cyl_faces', options: ['A. 2个','B. 3个','C. 4个','D. 6个'], answer: 1, difficulty: 1, tag: '圆柱结构', explanation: '圆柱由两个底面（圆形）和一个侧面围成，共3个面。故选B。' },
            { dimension: 'perception', question: '下列图形中，属于平面图形的是（　）。', svg: 'plane_angle', options: ['A. 长方体','B. 球','C. 角','D. 棱柱'], answer: 2, difficulty: 1, tag: '平面图形', explanation: '长方体、球、棱柱都是立体图形；角由两条射线组成，在一个平面内，是平面图形。故选C。' },
            { dimension: 'perception', question: '长方体共有（　）条棱。', svg: 'cuboid_edges', options: ['A. 8条','B. 10条','C. 12条','D. 16条'], answer: 2, difficulty: 2, tag: '长方体', explanation: '长方体有6个面、12条棱、8个顶点。故选C。' },
            { dimension: 'perception', question: '五棱柱共有（　）个顶点。', svg: 'pentaprism', options: ['A. 5个','B. 10个','C. 15个','D. 20个'], answer: 1, difficulty: 2, tag: '棱柱结构', explanation: '五棱柱有两个五边形的底面，每个底面有5个顶点，共5×2=10个顶点。故选B。' },
            { dimension: 'perception', question: '从三个不同方向观察同一个正方体，看到的图形都是（　）。', svg: 'cube_views3', options: ['A. 长方形','B. 正方形','C. 三角形','D. 圆'], answer: 1, difficulty: 2, tag: '从不同方向看', explanation: '正方体的每个面都是正方形，从任何方向观察正方体，看到的都是一个正方形。故选B。' },
            { dimension: 'perception', question: '三棱柱的侧面都是（　）。', svg: 'triprism', options: ['A. 三角形','B. 长方形','C. 五边形','D. 圆形'], answer: 1, difficulty: 2, tag: '棱柱结构', explanation: '三棱柱的两个底面是三角形，三个侧面都是长方形（矩形）。故选B。' },
            { dimension: 'perception', question: '用一个平面去截一个正方体，得到的截面不可能是（　）。', svg: 'cube_section', options: ['A. 三角形','B. 正方形','C. 五边形','D. 圆'], answer: 3, difficulty: 3, tag: '截面', explanation: '正方体的每个面都是平面，用平面去截，截面只能是多边形（三角形、四边形、五边形、六边形），不可能是圆。故选D。' },
            { dimension: 'perception', question: '直角三角形绕它的一条直角边旋转一周，得到的立体图形是（　）。', svg: 'rt_tri_rotate', options: ['A. 圆柱','B. 圆锥','C. 球','D. 棱锥'], answer: 1, difficulty: 3, tag: '旋转体', explanation: '直角三角形绕直角边旋转一周，斜边扫出圆锥的侧面，另一条直角边扫出底面圆，得到圆锥。故选B。' },
            { dimension: 'perception', question: '下列几何体中，面数最多的是（　）。', svg: 'solids_count', options: ['A. 圆柱','B. 圆锥','C. 正方体','D. 球'], answer: 2, difficulty: 3, tag: '面数比较', explanation: '圆柱有3个面，圆锥有2个面，正方体有6个面，球只有1个曲面，面数最多的是正方体。故选C。' },
            // ===== 心理旋转 rotation（10题） =====
            { dimension: 'rotation', question: '正方体共有（　）种不同的展开图（旋转、翻转后相同视为一种）。', svg: 'net_11', options: ['A. 8种','B. 10种','C. 11种','D. 12种'], answer: 2, difficulty: 1, tag: '展开图', explanation: '正方体共有11种不同的展开图，这是七年级几何中的经典结论。故选C。' },
            { dimension: 'rotation', question: '"田"字形（2×2）的展开图（　）围成正方体。', svg: 'net_tian', options: ['A. 能','B. 不能','C. 不一定','D. 无法判断'], answer: 1, difficulty: 1, tag: '展开图', explanation: '田字形4个面共用一个顶点，折叠时四个面会重叠挤压，无法构成正方体。故选B。' },
            { dimension: 'rotation', question: '圆柱的侧面展开图是（　）。', svg: 'cyl_net', options: ['A. 长方形','B. 扇形','C. 三角形','D. 梯形'], answer: 0, difficulty: 1, tag: '展开图', explanation: '沿圆柱一条母线剪开展平，侧面展开图是一个长方形（长为底面周长，宽为高）。故选A。' },
            { dimension: 'rotation', question: '圆锥的侧面展开图是（　）。', svg: 'cone_net', options: ['A. 长方形','B. 扇形','C. 圆形','D. 梯形'], answer: 1, difficulty: 2, tag: '展开图', explanation: '沿圆锥一条母线剪开展平，侧面展开图是一个扇形（半径为母线长，弧长为底面周长）。故选B。' },
            { dimension: 'rotation', question: '如图是正方体的一种展开图（1-4-1型），中间一行的四个面分别标有1、2、3、4，上面的面标5，下面的面标6，则与数字2相对的面上的数字是（　）。', svg: 'net_141', options: ['A. 1','B. 3','C. 4','D. 6'], answer: 2, difficulty: 2, tag: '展开图折叠', explanation: '1-4-1型展开图折叠成正方体后，2与4相对（1与3相对，5与6相对）。故选C。' },
            { dimension: 'rotation', question: '将一个正方形绕它的中心旋转90°后，得到的图形与原图形（　）。', svg: 'square_rot90', options: ['A. 完全重合','B. 不重合','C. 部分重合','D. 无法确定'], answer: 0, difficulty: 2, tag: '旋转对称', explanation: '正方形绕中心每旋转90°都能与原图形重合，这是正方形的旋转对称性。故选A。' },
            { dimension: 'rotation', question: '在正方体展开图中，相对的两个面折叠成正方体后（　）。', svg: 'cube_opposite', options: ['A. 一定相邻','B. 一定不相邻','C. 可能相邻','D. 无法判断'], answer: 1, difficulty: 2, tag: '相对面', explanation: '折叠成正方体后，相对的两个面位于正方体的相对位置，一定不相邻。故选B。' },
            { dimension: 'rotation', question: '半圆以它的直径为轴旋转一周，得到的立体图形是（　）。', svg: 'semi_ball_rotate', options: ['A. 圆柱','B. 圆锥','C. 球','D. 棱锥'], answer: 2, difficulty: 3, tag: '旋转体', explanation: '半圆绕直径旋转一周，半圆弧扫出球面，直径扫出球的直径，形成的立体图形是球。故选C。' },
            { dimension: 'rotation', question: '将一个正三角形绕它的中心旋转120°后，得到的图形与原图形（　）。', svg: 'tri_rot120', options: ['A. 完全重合','B. 不重合','C. 部分重合','D. 无法确定'], answer: 0, difficulty: 3, tag: '旋转对称', explanation: '正三角形绕中心每旋转120°（360°÷3）都能与原图形重合。故选A。' },
            { dimension: 'rotation', question: '将一个正方体绕它相对两个面的中心连线旋转90°后，得到的图形（　）。', svg: 'cube_rot90', options: ['A. 与原正方体完全重合','B. 形状改变','C. 位置改变','D. 无法确定'], answer: 0, difficulty: 3, tag: '旋转对称', explanation: '正方体绕相对两个面的中心连线旋转90°，由于正方体的对称性，旋转后的正方体与原正方体完全重合。故选A。' },
            // ===== 空间可视化 visualization（10题） =====

        function getDimById(id) {

        function startQuiz() {

        function renderQuestion() {
            var q = questions[currentQuestionIndex];
            var dim = getDimById(q.dimension);

            document.getElementById('currentQ').textContent = currentQuestionIndex + 1;
            document.getElementById('totalQ').textContent = questions.length;
            document.getElementById('totalQ2').textContent = questions.length;
            document.getElementById('progressFill').style.width = ((currentQuestionIndex + 1) / questions.length * 100) + '%';

            var answeredCount = 0;
            for (var i = 0; i < userAnswers.length; i++) {
                if (userAnswers[i] !== null) answeredCount++;
            }
            document.getElementById('answeredQ').textContent = answeredCount;

            document.getElementById('dimensionBadge').textContent = dim.icon + ' ' + dim.name;
            document.getElementById('questionNumber').textContent = '第 ' + (currentQuestionIndex + 1) + ' 题 · ' + dim.name;
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('questionSvg').innerHTML = generateSVG(q.svg);

            var optionsHtml = '';
            for (var idx = 0; idx < q.options.length; idx++) {
                optionsHtml += '<div class="option-btn" id="opt_' + idx + '" onclick="selectOption(' + idx + ')">' +
                    '<span class="option-letter">' + String.fromCharCode(65 + idx) + '</span>' +
                    '<span class="option-text">' + q.options[idx].substring(3) + '</span></div>';
            }
            document.getElementById('optionsGrid').innerHTML = optionsHtml;
            document.getElementById('feedbackBox').className = 'feedback-box hidden';
            document.getElementById('feedbackBox').innerHTML = '';

            // 若该题已作答，恢复锁定与反馈状态
            if (userAnswers[currentQuestionIndex] !== null) {
                lockQuestion(userAnswers[currentQuestionIndex], true);
            }

            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').textContent = currentQuestionIndex === questions.length - 1 ? '提交答卷 ✓' : '下一题 →';
        }

        function selectOption(idx) {
            if (userAnswers[currentQuestionIndex] !== null) return;
            userAnswers[currentQuestionIndex] = idx;
            lockQuestion(idx, false);
        }

        function lockQuestion(idx, isRestore) {
            var q = questions[currentQuestionIndex];
            var options = document.querySelectorAll('.option-btn');
            var correctIdx = q.answer;

            for (var i = 0; i < options.length; i++) {
                options[i].classList.add('locked');
                options[i].setAttribute('onclick', '');
                if (i === idx) {
                    options[i].classList.add('selected');
                    if (i === correctIdx) {
                        options[i].classList.add('correct');
                    } else {
                        options[i].classList.add('wrong');
                    }
                }
                if (i === correctIdx && idx !== correctIdx) {
                    options[i].classList.add('correct');
                }
            }

            // 显示即时反馈
            var fb = document.getElementById('feedbackBox');
            var isCorrect = idx === correctIdx;
            if (isCorrect) {
                fb.className = 'feedback-box feedback-correct';
                fb.innerHTML = '<div class="fb-title">✓ 回答正确</div><div class="fb-exp">💡 ' + q.explanation + '</div>';
            } else {
                fb.className = 'feedback-box feedback-wrong';
                fb.innerHTML = '<div class="fb-title">✗ 回答错误</div>' +
                    '<div>正确答案：' + q.options[correctIdx] + '</div>' +
                    '<div class="fb-exp">💡 ' + q.explanation + '</div>';
            }
            fb.style.display = 'block';

            // 更新已答数量
            var answeredCount = 0;
            for (var i = 0; i < userAnswers.length; i++) {
                if (userAnswers[i] !== null) answeredCount++;
            }
            document.getElementById('answeredQ').textContent = answeredCount;

            // 维度切换动效
            var badge = document.getElementById('dimensionBadge');
            badge.classList.remove('flash');
            void badge.offsetWidth;
            badge.classList.add('flash');
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) {
                alert('请先选择本题的答案');
                return;
            }
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                submitQuiz();
            }
        }

        // ==================== 计时 ====================
        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(function() {
                remainingTime--;
                updateTimerDisplay();
                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            var minutes = Math.floor(remainingTime / 60);
            var seconds = remainingTime % 60;
            document.getElementById('timeDisplay').textContent =
                (minutes < 10 ? '0' : '') + minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
        }

        function getElapsedText() {
            var sec = Math.round((new Date().getTime() - quizStartTime) / 1000);
            if (sec < 60) return sec + '秒';
            var m = Math.floor(sec / 60);
            var s = sec % 60;
            return m + '分' + (s < 10 ? '0' : '') + s + '秒';
        }

        function calculateAllScores() {


            var dimScores = {};
            var dimMax = {};
            var dimCorrect = {};
            for (var i = 0; i < dimensions.length; i++) {
                dimScores[dimensions[i].id] = 0;
                dimMax[dimensions[i].id] = 0;
                dimCorrect[dimensions[i].id] = 0;
            }
            var totalScore = 0;
            var totalMax = 0;
            var totalCorrect = 0;

            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                dimMax[q.dimension] += q.difficulty;
                totalMax += q.difficulty;
                if (userAnswers[i] !== null && userAnswers[i] === q.answer) {
                    dimScores[q.dimension] += q.difficulty;
                    dimCorrect[q.dimension]++;
                    totalScore += q.difficulty;
                    totalCorrect++;
                }
            }

            var dims = {};
            for (var i = 0; i < dimensions.length; i++) {
                var d = dimensions[i];
                var max = dimMax[d.id];
                dims[d.id] = {
                    name: d.name,
                    short: d.short,
                    icon: d.icon,
                    color: d.color,
                    subjects: d.subjects,
                    score: dimScores[d.id],
                    maxScore: max,
                    correct: dimCorrect[d.id],
                    total: 10,
                    percentage: max > 0 ? Math.round(dimScores[d.id] / max * 100) : 0
                };
            }

            return {
                dimensions: dims,
                totalScore: totalScore,
                totalMaxScore: totalMax,
                overallPercentage: totalMax > 0 ? Math.round(totalScore / totalMax * 100) : 0,
                totalCorrect: totalCorrect,
                totalQuestions: questions.length
            };
        }

        // ==================== 图表绘制 ====================
        function drawRing(canvasEl, pct, color) {
            var c = canvasEl;
            var ctx = c.getContext('2d');
            var size = 190, cx = size / 2, cy = size / 2, r = 78;
            c.width = size;
            c.height = size;
            ctx.clearRect(0, 0, size, size);
            ctx.lineWidth = 16;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(100,116,139,.12)';
            ctx.stroke();
            var start = -Math.PI / 2;
            var end = start + Math.PI * 2 * pct / 100;
            var grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#667eea');
            grad.addColorStop(1, '#764ba2');
            ctx.strokeStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, r, start, end);
            ctx.stroke();
        }

        function drawRadar(canvasEl, scores) {
            var c = canvasEl;
            var ctx = c.getContext('2d');
            var size = 340, cx = size / 2, cy = size / 2, r = 118, n = 6;
            c.width = size;
            c.height = size;
            var keys = [];
            var labels = [];
            var colors = [];
            for (var id in scores.dimensions) {
                keys.push(id);
                labels.push(scores.dimensions[id].short);
                colors.push(scores.dimensions[id].color);
            }
            var step = Math.PI * 2 / n;
            ctx.strokeStyle = 'rgba(100,116,139,.16)';
            ctx.lineWidth = 1;
            for (var l = 1; l <= 5; l++) {
                ctx.beginPath();
                var rr = r * l / 5;
                for (var i = 0; i <= n; i++) {
                    var a = step * i - Math.PI / 2;
                    var x = cx + rr * Math.cos(a);
                    var y = cy + rr * Math.sin(a);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            }
            for (var i = 0; i < n; i++) {
                var a = step * i - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
                ctx.stroke();
            }
            var pts = [];
            ctx.beginPath();
            for (var i = 0; i < n; i++) {
                var pct = scores.dimensions[keys[i]].percentage;
                var rr = r * pct / 100;
                var a = step * i - Math.PI / 2;
                var x = cx + rr * Math.cos(a);
                var y = cy + rr * Math.sin(a);
                pts.push({ x: x, y: y });
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            var grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, 'rgba(102,126,234,.4)');
            grad.addColorStop(1, 'rgba(118,75,162,.3)');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            for (var i = 0; i < pts.length; i++) {
                ctx.beginPath();
                ctx.arc(pts[i].x, pts[i].y, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#667eea';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            for (var i = 0; i < n; i++) {
                var a = step * i - Math.PI / 2;
                var x = cx + (r + 26) * Math.cos(a);
                var y = cy + (r + 26) * Math.sin(a);
                ctx.fillStyle = '#334155';
                ctx.fillText(labels[i], x, y);
                ctx.fillStyle = colors[i];
                ctx.fillText(scores.dimensions[keys[i]].percentage + '%', x, y + 17);
            }
            return c;
        }

        function drawBar(canvasEl, scores) {
            var c = canvasEl;
            var ctx = c.getContext('2d');
            var w = 460, h = 230;
            c.width = w;
            c.height = h;
            var keys = [];
            var labels = [];
            var colors = [];
            for (var id in scores.dimensions) {
                keys.push(id);
                labels.push(scores.dimensions[id].short);
                colors.push(scores.dimensions[id].color);
            }
            var bw = 46, gap = 26, sx = 40, sy = h - 40, maxH = 130;
            ctx.font = 'bold 12px sans-serif';
            for (var i = 0; i < keys.length; i++) {
                var pct = scores.dimensions[keys[i]].percentage;
                var bh = maxH * pct / 100;
                var x = sx + i * (bw + gap);
                var grad = ctx.createLinearGradient(0, sy - bh, 0, sy);
                grad.addColorStop(0, colors[i]);
                grad.addColorStop(1, colors[i] + '88');
                ctx.fillStyle = grad;
                ctx.fillRect(x, sy - bh, bw, bh);
                ctx.fillStyle = '#334155';
                ctx.textAlign = 'center';
                ctx.fillText(pct + '%', x + bw / 2, sy - bh - 8);
                ctx.fillStyle = '#64748b';
                ctx.font = '11px sans-serif';
                ctx.fillText(labels[i], x + bw / 2, sy + 18);
                ctx.font = 'bold 12px sans-serif';
            }
            ctx.strokeStyle = 'rgba(100,116,139,.15)';
            ctx.beginPath();
            ctx.moveTo(sx - 5, sy);
            ctx.lineTo(w - 10, sy);
            ctx.stroke();
            return c;
        }

        function getWrongList() {
            var wrongs = [];
            for (var i = 0; i < questions.length; i++) {
                var q = questions[i];
                if (userAnswers[i] !== null && userAnswers[i] !== q.answer) {
                    var dim = getDimById(q.dimension);
                    wrongs.push({ qi: i, q: q, ua: userAnswers[i], dimName: dim.name, short: dim.short, color: dim.color });
                }
            }
            return wrongs;
        }

        function buildKpCluster(wrongs) {
            var map = {};
            for (var i = 0; i < wrongs.length; i++) {
                var tag = wrongs[i].q.tag;
                if (!map[tag]) map[tag] = { tag: tag, count: 0, names: [] };
                map[tag].count++;
                if (map[tag].names.indexOf(wrongs[i].short) < 0) map[tag].names.push(wrongs[i].short);
            }
            var arr = [];
            for (var t in map) arr.push(map[t]);
            arr.sort(function (a, b) { return b.count - a.count; });
            return arr;
        }

        function getSubjectAdvice(scores) {
            var s = [], d = [];
            for (var id in scores.dimensions) {
                var dim = scores.dimensions[id];
                if (dim.percentage >= 80) s.push(dim.name);
                if (dim.percentage < 55) d.push(dim.name);
            }
            return { s: s, d: d };
        }

        function generateReport(info, scores, elapsedText) {

                html += '<p style="font-size:.9em;color:var(--tm);line-height:1.8">' + getLevelText(dim.percentage) + '</p>';
                html += '</div>';
            }
            html += '</div>';

            // 知识点错题聚类
            html += '<div class="card"><h3 class="section-title">🎯 薄弱知识点聚类</h3>';

                html += '<div class="no-wrong">太棒了！本次测评没有做错的题目，继续保持！</div>';
            } else {
                html += '<div class="kp-list">';
                var maxCount = kp[0].count;

            html += '</div>';

            // 错题回顾

            } else {
                for (var i = 0; i < wrongs.length; i++) {

                    html += '<div class="explanation">💡 ' + w.q.explanation + '</div>';
                    html += '</div>';
                }
            }
            html += '</div>';

            // 综合解读
            html += '<div class="card"><h3 class="section-title">💬 综合解读</h3>';
            html += '<div class="summary-box">';
            var strong = null, weak = null;
            for (var i = 0; i < keys.length; i++) {
                var dim = scores.dimensions[keys[i]];

                if (!weak || dim.percentage < weak.percentage) weak = dim;

            html += '</div>';

                        // 学科关联与中考升学规划建议（初一版）

            html += '<div class="plan-card" style="margin-top:16px"><div class="plan-title">🎓 中考升学规划建议</div><p style="font-size:.93em;line-height:1.9;color:var(--t)">' + selAdvice + '</p></div>';

            html += '<p class="parent-text">' + pMsg + '</p></div></div>';
